<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TZGRO 珠寶人生</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FBFBFC;--ink:#1d2b28;--muted:#6b7672;--line:#e3e4e8;--card:#fff;--emerald:#1F7A5C;--sapphire:#2B4C9B;--ruby:#B3324A;--amethyst:#7A4FA0;--citrine:#C9962B;--soft:#f2f3f6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 'Noto Sans TC',system-ui,sans-serif}
.num{font-family:'Space Mono',monospace;font-weight:700}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:7px 12px}
button:disabled{opacity:.4;cursor:not-allowed}
button.primary{background:var(--emerald);border-color:var(--emerald);color:#fff}
.locked{display:none!important}
.new{animation:newbie 1.6s ease-out}
@keyframes newbie{0%{box-shadow:0 0 0 0 #c9962b00}20%{box-shadow:0 0 0 6px #c9962bcc}100%{box-shadow:0 0 0 0 #c9962b00}}
.glow{animation:glow 1.1s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 5px #c9962b,0 0 24px 6px #c9962b99}}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header .brand{font-weight:800;letter-spacing:.06em}
.stat{border-radius:10px;padding:2px 6px}
.stat small{display:block;color:var(--muted);font-size:11px}
.stat b{font-size:17px}
.speed{margin-left:auto;display:flex;gap:6px;align-items:center}
.speed button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
#playBtn{font-size:16px;font-weight:700;padding:9px 18px}
.grid{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;margin-top:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.card h2{margin:0 0 10px;font-size:15px}
.card h2 small{color:var(--muted);font-weight:400}
.bars{display:grid;gap:12px;margin-top:14px}
.bars>div{border-radius:10px}
.bar{height:12px;border-radius:99px;background:var(--soft);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.barrow{display:flex;justify-content:space-between;gap:8px;font-size:13px;margin-bottom:4px}
.hint{font-size:11.5px;color:var(--muted);margin-top:3px}
.danger{color:var(--ruby)}
#map{position:relative;height:300px;border-radius:14px;background:linear-gradient(160deg,#f6f2ea,#eef3f1);overflow:hidden}
.region{position:absolute;z-index:1;transform:translate(-50%,-50%);text-align:center;font-size:12px}
.region .dot{border-radius:50%;margin:0 auto 4px;display:grid;place-items:center;font-size:11px;color:#fff;box-shadow:0 6px 18px #0001}
.region.closed .dot{filter:grayscale(1);opacity:.45}
.bubble{position:absolute;z-index:2;width:44px;height:44px;border-radius:50%;border:0;padding:0;background:radial-gradient(circle at 35% 30%,#fff,var(--citrine));color:#5a3e00;font-weight:800;box-shadow:0 6px 16px #c9962b55;animation:pop .35s ease-out}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.tree{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.branch h3{margin:0 0 6px;font-size:13px}
.node{display:block;width:100%;text-align:left;margin-bottom:6px;padding:8px 10px;font-size:13px;border-radius:10px}
.node small{display:block;color:var(--muted);font-size:11.5px}
.node.own{background:#e9f4ef;border-color:#bfe0d1}
.node.own small{color:var(--emerald)}
.more{font-size:12.5px;color:var(--muted);margin-top:6px}
.product h3{color:var(--ruby)}.channel h3{color:var(--sapphire)}.org h3{color:var(--amethyst)}
.ops{display:grid;gap:12px;align-content:start}
.opsrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input[type=range]{width:100%;accent-color:var(--sapphire)}
.rooms{display:flex;gap:6px;flex-wrap:wrap}
.room{padding:6px 9px;border-radius:9px;background:var(--soft);font-size:12px;color:var(--muted)}
.room.on{background:#fbefd7;color:#6b4b00}
#log{max-height:220px;overflow:auto;font-size:12.5px;color:var(--muted)}
#log div{padding:3px 0;border-bottom:1px dashed var(--line)}
canvas{width:100%;height:120px}
details summary{cursor:pointer;font-weight:700;font-size:14px}
.overlay{position:fixed;inset:0;background:#1d2b2844;display:grid;place-items:center;z-index:10;padding:16px}
.overlay[hidden]{display:none}
.dialog{background:var(--card);border-radius:18px;max-width:560px;width:100%;padding:22px;max-height:90vh;overflow:auto}
.dialog h2{margin:0 0 8px}
.dialog p{white-space:pre-line}
.choices{display:grid;gap:8px;margin-top:14px}
.choices button{text-align:left;padding:10px 12px}
.starts{display:grid;gap:8px;margin:10px 0}
.starts label{display:block;border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}
.starts input{margin-right:6px}
.now{display:flex;flex-wrap:wrap;gap:6px 14px;background:var(--soft);border-radius:12px;padding:9px 12px;font-size:13px;margin:8px 0}
.now b{font-family:'Space Mono',monospace}
.toast{position:fixed;right:16px;bottom:16px;max-width:360px;background:var(--ink);color:#fff;border-radius:14px;padding:12px 14px;font-size:13px;z-index:9;box-shadow:0 10px 30px #0003}
.toast b{color:#f5d68a}
.toast[hidden]{display:none}
.diag{display:grid;gap:8px;margin-top:10px}
.diag div{border:1px solid var(--line);border-radius:12px;padding:9px 11px;font-size:13px}
.diag .bad{border-color:#e9b9c2;background:#fdf3f5}
.diag em{font-style:normal;color:var(--muted);display:block}
.leads{display:grid;gap:8px}
.leads label{display:flex;justify-content:space-between;gap:10px;align-items:center}
.leads select{font:inherit;padding:5px;border-radius:8px;border:1px solid var(--line)}
#spot{position:fixed;z-index:20;border-radius:14px;box-shadow:0 0 0 9999px #1d2b2866;pointer-events:none;transition:all .2s}
.grid:has(#ops.locked){grid-template-columns:1fr}
#coach{position:fixed;z-index:23;width:min(340px,calc(100vw - 32px));background:var(--card);border-radius:16px;padding:16px;box-shadow:0 14px 40px #0003;border:2px solid var(--citrine)}
#coach h3{margin:0 0 6px;font-size:16px}
#coach p{margin:0 0 10px;font-size:15px}
#coach .todo{background:#fbf3df;border-radius:10px;padding:8px 10px;font-weight:700;color:#6b4b00;font-size:14.5px;margin-bottom:10px}
#coach .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
#coach .skip{border:0;background:none;color:var(--muted);font-size:12px;padding:4px}
#pointer{position:fixed;z-index:24;background:var(--citrine);color:#fff;font-weight:800;font-size:14px;padding:4px 10px;border-radius:99px;pointer-events:none;animation:bounce .8s ease-in-out infinite;white-space:nowrap}
@keyframes bounce{50%{transform:translateY(-6px)}}
#spot[hidden],#coach[hidden],#pointer[hidden]{display:none}
.tip{background:#fbf3df;border-radius:12px;padding:10px 12px;font-size:14px;margin:8px 0}
.help h3{margin:14px 0 4px;font-size:14px}
.help p,.help li{font-size:14px;margin:2px 0}
@media(max-width:860px){.grid{grid-template-columns:1fr}.tree{grid-template-columns:1fr}header{gap:8px 14px}.speed{margin-left:0}}
</style>
</head>
<body>
<header>
  <div class="brand">TZGRO 珠寶人生</div>
  <div class="stat"><small>日期</small><b class="num" id="date">—</b></div>
  <div class="stat"><small>現金</small><b class="num" id="cash">—</b></div>
  <div class="stat" data-u="points" id="ptsStat"><small>口碑點（換能力用）</small><b class="num" id="pts">—</b></div>
  <div class="stat" data-u="records"><small>本月營收</small><b class="num" id="rev">—</b></div>
  <div class="stat" data-u="capacity"><small>口碑／士氣</small><b class="num" id="bm">—</b></div>
  <button id="helpBtn">玩法</button>
  <div class="speed" id="speed">
    <button id="playBtn" class="primary">▶ 開始營業</button>
    <button data-x="0" data-u="started">暫停</button><button data-x="1" data-u="started" class="on">1x</button><button data-x="2" data-u="fast">2x</button><button data-x="4" data-u="fast">4x</button>
  </div>
</header>
<div class="wrap">
  <div class="grid">
    <section class="card">
      <h2>市場 <small>綠色＝你的客人</small></h2>
      <div id="map"></div>
      <div class="bars">
        <div data-u="rival" id="rivalBar"><div class="barrow"><span>你的客人 vs 對手的客人</span><span class="num" id="shareText"></span></div><div class="bar"><i id="mine" style="background:var(--emerald)"></i><i style="flex:1"></i><i id="comp" style="background:var(--ruby)"></i></div><div class="hint">紅色到 60% 就輸了</div></div>
        <div data-u="capacity" id="capBar"><div class="barrow"><span>這個月的訂單 / 你們做得完的量</span><span class="num" id="capText"></span></div><div class="bar"><i id="cap" style="background:var(--amethyst)"></i></div><div class="hint">變紅＝做不完，口碑和士氣會掉</div></div>
        <div data-u="ads" id="runBar"><div class="barrow"><span>現金還能撐幾個月</span><span class="num" id="runText"></span></div><div class="bar"><i id="run" style="background:var(--citrine)"></i></div></div>
        <div data-u="goal" id="goalBar"><div class="barrow"><span>今年營收 / 今年目標</span><span class="num" id="goalText"></span></div><div class="bar"><i id="goal" style="background:var(--sapphire)"></i></div></div>
      </div>
    </section>
    <section class="card ops" data-u="ops" id="ops">
      <h2>經營</h2>
      <div data-u="ads" id="adsBox"><div class="barrow"><span>每月廣告預算 <small style="color:var(--muted)">（花錢買曝光）</small></span><span class="num" id="adText"></span></div><input type="range" id="ads" min="0" max="3000000" step="50000" value="0"></div>
      <div class="opsrow" data-u="capacity"><button id="hire">招募 1 人</button><button id="expand">擴張辦公室</button><button id="fire" data-u="records">資遣 1 人</button><span id="team" style="font-size:13px;color:var(--muted)"></span></div>
      <div class="rooms" id="rooms" data-u="capacity"></div>
      <details data-u="records" id="recordsBox"><summary>營收圖與經營紀錄</summary><canvas id="chart" width="600" height="160"></canvas><div id="log"></div></details>
    </section>
  </div>
  <section class="card" style="margin-top:16px" data-u="tree" id="treeCard">
    <h2>能力 <small>用口碑點＋現金買</small></h2>
    <div class="tree" id="tree"></div>
  </section>
</div>
<div class="overlay" id="overlay"><div class="dialog" id="dialog"></div></div>
<div class="toast" id="toast" hidden></div>
<div id="spot" hidden></div>
<div id="pointer" hidden>點這裡 ↓</div>
<div id="coach" hidden></div>
<script src="engine.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id), esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const POS = { north: [60, 28], south: [52, 64], hk: [24, 46], sg: [18, 78], jp: [84, 32] };
const ALL = ['points', 'started', 'fast', 'rival', 'capacity', 'ads', 'goal', 'tree', 'treeOpen', 'leads', 'records', 'ops'];
const MODE_KEY = 'tzgro-mode';
let S = null, speed = 1, acc = 0, last = performance.now(), toastTimer = 0;
let mode = 'new', open = new Set(ALL), coach = null, seen = {}, flags = {};
const money = n => (n < 0 ? '-' : '') + 'NT$' + Math.round(Math.abs(n) / 10000).toLocaleString('zh-TW') + '萬';
const storeGet = k => { try { return localStorage.getItem(k); } catch { return null; } };
const storeSet = (k, v) => { try { localStorage.setItem(k, v); } catch {} };

// ── 畫面開放 ──
function unlock(...ids) {
  for (const id of ids) {
    if (open.has(id)) continue;
    open.add(id);
    if (['capacity', 'ads', 'records'].includes(id)) open.add('ops');
    document.querySelectorAll(`[data-u="${id}"]`).forEach(el => { el.classList.remove('locked'); el.classList.add('new'); setTimeout(() => el.classList.remove('new'), 1700); });
  }
  applyLocks();
}
function applyLocks() {
  document.querySelectorAll('[data-u]').forEach(el => el.classList.toggle('locked', !open.has(el.dataset.u)));
  $('playBtn').classList.toggle('locked', open.has('started'));
}

function startScreen() {
  const starts = Object.entries(V3.STARTS).map(([k, v], i) => `<label><input type="radio" name="start" value="${k}" ${i ? '' : 'checked'}><b>${v.name}</b>　<span style="color:var(--muted)">${v.desc}</span></label>`).join('');
  const diffs = Object.entries(V3.DIFFICULTY).map(([k, v]) => `<label><input type="radio" name="diff" value="${k}" ${k === 'normal' ? 'checked' : ''}>${v.name}</label>`).join('');
  const saved = storeGet(MODE_KEY) || 'new';
  dialog(`<h2>TZGRO 珠寶人生</h2>
    <p>經營一家彩色寶石公司，從 2019 年做到 2025 年底。</p>
    <h3>怎麼玩</h3><div class="starts">
      <label><input type="radio" name="mode" value="new" ${saved === 'new' ? 'checked' : ''}><b>新手</b>　<span style="color:var(--muted)">一步一步教，畫面慢慢打開</span></label>
      <label><input type="radio" name="mode" value="pro" ${saved === 'pro' ? 'checked' : ''}><b>老手</b>　<span style="color:var(--muted)">全部畫面直接打開，不教學</span></label></div>
    <details><summary>開局與難度（可不選）</summary><h3>開局</h3><div class="starts">${starts}</div><h3>難度</h3><div class="starts" style="grid-template-columns:repeat(3,1fr)">${diffs}</div></details>
    <div class="choices"><button class="primary" id="go">開始</button><button id="startHelp">先看玩法</button></div>`);
  $('startHelp').onclick = helpCard;
  $('go').onclick = () => {
    mode = document.querySelector('[name=mode]:checked').value; storeSet(MODE_KEY, mode);
    S = V3.create({ start: document.querySelector('[name=start]:checked').value, difficulty: document.querySelector('[name=diff]:checked').value, seed: Date.now() >>> 0 });
    seen = {}; flags = {}; coach = null; speed = 1; acc = 0;
    open = mode === 'pro' ? new Set(ALL) : new Set();
    closeDialog();
    if (mode === 'new') V3.confirmEra(S); // 第一年負責人照預設，不先問
    applyLocks(); render();
    if (mode === 'pro') { open.add('started'); applyLocks(); showDecision(); }
  };
}
function dialog(html) { $('dialog').innerHTML = html; $('overlay').hidden = false; }
function closeDialog() { $('overlay').hidden = true; }
function toast(html, keep) { $('toast').innerHTML = html; $('toast').hidden = false; clearTimeout(toastTimer); if (!keep) toastTimer = setTimeout(() => $('toast').hidden = true, 7000); }

function nowRow() {
  const v = V3.view(S), h = v.h;
  return `<div class="now"><span>你現在的狀況</span><span>訂單 <b>${Math.round(h.orders)}</b> / 做得完 <b>${Math.round(v.capacity)}</b></span><span>現金還能撐 <b>${v.runway >= 99 ? '有賺錢' : v.runway.toFixed(1) + ' 個月'}</b></span><span>口碑 <b>${Math.round(S.brand)}</b></span></div>`;
}
function showDecision() {
  const e = S.queue[0];
  if (!e) return;
  if (e.type === 'era') {
    const firstLeads = mode === 'new' && !seen.leads;
    if (firstLeads) { seen.leads = true; unlock('leads', 'treeOpen'); }
    const g = S.metrics.goals.at(-1), opts = id => S.staff.map(p => `<option value="${p.id}" ${S.leads[id] === p.id ? 'selected' : ''}>${esc(p.name)}（${V3.BRANCH[id]}能力 ${p.skill[id]}）</option>`).join('') + `<option value="" ${S.leads[id] ? '' : 'selected'}>（從缺）</option>`;
    dialog(`<h2>${V3.view(S).year} 年開始</h2>
      ${g ? `<p>${g.year} 年營收 <b class="num">${money(g.revenue)}</b>／目標 ${money(g.goal)}　${g.hit ? '✓ 達成' : '未達成'}</p>` : ''}
      <p>今年目標：<b class="num">${money(V3.ERA_GOALS[Math.floor(S.t / 12)])}</b>　（新年度送 2 口碑點）</p>
      ${firstLeads ? '<div class="tip">從今年起，你可以指派三位負責人：商品、通路、組織。括號裡的能力越高，那個部門效果越好；同一人兼兩個會分心。不確定就先照預設。</div>' : ''}
      <div class="leads">${['product', 'channel', 'org'].map(id => `<label>${V3.BRANCH[id]}負責人<select data-slot="${id}">${opts(id)}</select></label>`).join('')}</div>
      <div class="choices"><button class="primary" id="eraOk">開始這一年</button></div>`);
    $('eraOk').onclick = () => { document.querySelectorAll('[data-slot]').forEach(x => x.value ? V3.assign(S, x.dataset.slot, x.value) : (S.leads[x.dataset.slot] = null)); V3.confirmEra(S); closeDialog(); render(); showDecision(); };
    return;
  }
  const firstEvent = mode === 'new' && !seen.event;
  if (firstEvent) seen.event = true;
  dialog(`<h2>${esc(e.title)}</h2><p>${esc(e.text)}</p>${nowRow()}
    ${firstEvent ? '<div class="tip">突發狀況會暫停時間，等你決定。這題沒有標準答案：看上面的狀況再選。有「先查證」可以先點來看更多資訊。</div>' : ''}
    ${e.verify && !e.verified ? '<div class="choices"><button id="verify">先查證（花 1 口碑點）</button></div>' : ''}
    <div class="choices">${e.choices.map(([id, label]) => `<button data-c="${id}">${esc(label)}</button>`).join('')}</div>`);
  if ($('verify')) $('verify').onclick = () => { const err = V3.verify(S); if (err) toast(err); showDecision(); render(); };
  document.querySelectorAll('[data-c]').forEach(b => b.onclick = () => {
    const err = V3.choose(S, b.dataset.c); if (err) return toast(err);
    closeDialog();
    const r = S.reveals.shift();
    if (r) {
      const firstReveal = mode === 'new' && !flags.revealShown;
      toast(`<div>${esc(r.result)}</div><div style="margin-top:6px"><b>原則</b>　${esc(r.principle)}</div>`, firstReveal);
      if (firstReveal) { flags.revealShown = true; flags.revealPending = true; }
    }
    render(); afterStep();
  });
}
function afterStep() {
  if (S.phase === 'end') return endScreen();
  if (S.phase === 'decide') showDecision();
}
function endScreen() {
  const e = V3.ENDINGS[S.ending], d = V3.diagnose(S);
  dialog(`<h2>${e.title}</h2><p>${e.text}（${V3.ym(Math.max(0, S.t - 1))}）</p>
    <h3>經營診斷</h3><div class="diag">${d.map(x => `<div class="${x.ok ? '' : 'bad'}"><b>${x.key}</b>　<span class="num">${esc(x.value)}</span><em>${esc(x.principle)}</em></div>`).join('')}</div>
    <div class="choices"><button class="primary" id="again">再玩一局</button></div>`);
  $('again').onclick = startScreen;
}

function spawnBubbles(n) {
  const map = $('map');
  for (let i = 0; i < n; i++) {
    const b = document.createElement('button'); b.className = 'bubble'; b.textContent = '+1'; b.setAttribute('aria-label', '收成 1 口碑點');
    b.style.left = 8 + Math.random() * 78 + '%'; b.style.top = 12 + Math.random() * 66 + '%';
    b.onclick = () => { V3.collect(S, 1); b.remove(); flags.collected = true; render(); };
    map.appendChild(b);
    const expire = () => coach ? setTimeout(expire, 500) : b.remove();
    setTimeout(expire, 8000 / Math.max(1, speed));
  }
}

function render() {
  if (!S) return;
  const v = V3.view(S), h = v.h;
  $('date').textContent = v.date; $('cash').textContent = money(S.cash); $('rev').textContent = money(h.revenue);
  $('pts').textContent = S.points; $('bm').textContent = Math.round(S.brand) + '／' + Math.round(S.morale);
  $('mine').style.width = h.share * 100 + '%'; $('comp').style.width = h.comp * 100 + '%';
  $('shareText').innerHTML = `<span style="color:var(--emerald)">${(h.share * 100).toFixed(1)}%</span> vs <span class="${h.comp > .45 ? 'danger' : ''}">${(h.comp * 100).toFixed(1)}%</span>`;
  const run = Math.min(24, v.runway); $('run').style.width = run / 24 * 100 + '%';
  $('runText').innerHTML = v.runway >= 99 ? '有賺錢，不會燒完' : `<span class="${v.runway < 4 ? 'danger' : ''}">${v.runway.toFixed(1)} 個月</span>`;
  $('goal').style.width = Math.min(100, v.yearRevenue / v.goal * 100) + '%'; $('goalText').textContent = `${money(v.yearRevenue)} / ${money(v.goal)}`;
  $('cap').style.width = Math.min(100, h.orders / Math.max(1, v.capacity) * 100) + '%'; $('cap').style.background = h.orders > v.capacity ? 'var(--ruby)' : 'var(--amethyst)';
  $('capText').innerHTML = `<span class="${h.orders > v.capacity ? 'danger' : ''}">${Math.round(h.orders)} / ${Math.round(v.capacity)} 單</span>`;
  $('adText').textContent = money(S.adBudget); $('ads').value = S.adBudget;
  $('team').textContent = `${S.staff.length}/${v.seats} 人・${v.room}`;
  $('hire').disabled = S.staff.length >= v.seats;
  $('expand').disabled = !v.expandFee; $('expand').textContent = v.expandFee ? `擴張辦公室（${money(v.expandFee)}，${v.expandYear} 年起）` : '辦公室已最大';
  $('rooms').innerHTML = V3.ROOMS.map((r, i) => `<span class="room ${i <= S.office ? 'on' : ''}">${r}・${V3.SEATS[i]} 席</span>`).join('');
  // 市場：新手在對手出現前只看得到台灣北部
  const map = $('map'); map.querySelectorAll('.region').forEach(x => x.remove());
  for (const r of S.regions) {
    if (!open.has('rival') && r.id !== 'north') continue;
    const def = V3.REGIONS.find(x => x.id === r.id), isOpen = V3.isOpen(S, r), mine = (r.C + r.L) / r.N, comp = open.has('rival') ? r.K / r.N : 0, size = (40 + Math.sqrt(r.N) / 2.6) * Math.min(1, map.clientWidth / 560);
    const el = document.createElement('div'); el.className = 'region' + (isOpen ? '' : ' closed');
    el.style.left = POS[r.id][0] + '%'; el.style.top = POS[r.id][1] + '%';
    el.innerHTML = `<div class="dot" style="width:${size}px;height:${size}px;background:conic-gradient(var(--emerald) 0 ${mine * 360}deg,#d9dde3 ${mine * 360}deg ${360 - comp * 360}deg,var(--ruby) ${360 - comp * 360}deg)"><span class="num" style="background:#0006;padding:1px 5px;border-radius:6px">${Math.round(mine * 100)}%</span></div><b>${def.name}</b>${isOpen ? '' : `<div style="color:var(--muted)">需要「${V3.byId[def.unlock].name}」</div>`}`;
    map.appendChild(el);
  }
  // 能力：新手只看得到買得到的；第一張只有精選主打
  const visible = n => !open.has('treeOpen') ? n.id === 'select' : (V3.has(S, n.id) || V3.available(S, n.id)) && n.id !== 'fanpage';
  const hidden = V3.NODES.filter(n => !visible(n) && !V3.has(S, n.id) && n.id !== 'fanpage').length;
  $('tree').innerHTML = ['product', 'channel', 'org'].map(b => {
    const list = V3.NODES.filter(n => n.branch === b && (mode === 'pro' || visible(n)));
    if (!list.length) return '';
    return `<div class="branch ${b}"><h3>${V3.BRANCH[b]}</h3>${list.map(n => {
      const own = V3.has(S, n.id), ok = V3.available(S, n.id), afford = ok && S.points >= n.pts && S.cash >= n.cash;
      const meta = own ? '已擁有' : V3.view(S).year < n.year ? `${n.year} 年開放` : !n.req.every(r => V3.has(S, r)) ? '要先有：' + n.req.map(r => V3.byId[r].name).join('、') : `${n.pts} 口碑點＋${money(n.cash)}`;
      return `<button class="node ${own ? 'own' : ''}" data-node="${n.id}" ${own || !afford ? 'disabled' : ''}><b>${n.name}</b><small>${meta}</small><small>${esc(n.desc)}</small></button>`;
    }).join('')}</div>`;
  }).join('') + (mode === 'new' && hidden ? `<div class="more">還有 ${hidden} 個能力，之後開放</div>` : '');
  document.querySelectorAll('[data-node]').forEach(b => b.onclick = () => { const err = V3.buy(S, b.dataset.node); if (err) toast(err); render(); });
  $('log').innerHTML = S.log.slice(0, 40).map(l => `<div><span class="num">${l.date}</span>　${esc(l.text)}</div>`).join('');
  chart();
  checkCoach();
}
function chart() {
  const c = $('chart'), x = c.getContext('2d'), w = c.width, h = c.height, data = S.history.map(d => d.revenue);
  x.clearRect(0, 0, w, h); if (data.length < 2) return;
  const max = Math.max(...data) * 1.1;
  x.strokeStyle = '#2B4C9B'; x.lineWidth = 3; x.beginPath();
  data.forEach((d, i) => { const px = i / (V3.MONTHS - 1) * w, py = h - d / max * (h - 10) - 5; i ? x.lineTo(px, py) : x.moveTo(px, py); });
  x.stroke();
  x.fillStyle = '#6b7672'; x.font = '18px Space Mono'; x.fillText(money(max / 1.1), 6, 20);
}

// ── 新手教學：一次一件事；畫面跟著打開；說明卡之間一定隔著玩家動作或一個月 ──
const capHigh = () => { const h = S.history.at(-1); return h && h.orders > h.capacity * .8; };
const seatsFull = () => S.staff.length >= V3.view(S).seats;
const STEPS = [
  { id: 'start', when: () => true, target: '#playBtn', title: '你的第一家店', text: '這個圓是你的第一個市場：台灣北部。綠色會越來越多，代表你的客人。', todo: '點一下右上角「▶ 開始營業」', done: () => open.has('started') },
  { id: 'bubble', when: () => document.querySelector('.bubble'), target: '.bubble', title: '客人買東西了', text: '有客人買東西，就會冒出金色圓球。圓球放著會消失。', todo: '點一下金色圓球「+1」', done: () => flags.collected },
  { id: 'points', after: 'bubble', reveal: ['points'], target: '#ptsStat', title: '拿到 1 口碑點', text: '口碑點存在這裡，存夠了可以換能力。之後看到金色圓球都可以點。', auto: 3500 },
  { id: 'tree', after: 'points', when: () => S.points >= V3.byId.select.pts && S.cash >= V3.byId.select.cash, reveal: ['tree'], target: '[data-node=select]', title: '用口碑點換能力', text: '口碑點夠了。「精選主打」會讓更多客人下單。', todo: '點一下「精選主打」把它買下來', done: () => V3.has(S, 'select'), then: () => unlock('treeOpen') },
  { id: 'rival', after: 'tree', when: () => S.t >= 3, reveal: ['rival'], target: '#rivalBar', title: '對手出現了', text: '紅色是對手的客人。紅色到 60% 你就輸了。地圖上灰色的市場，以後要用能力打開。' },
  { id: 'capacity', after: 'tree', when: () => capHigh(), reveal: ['capacity'], target: () => seatsFull() ? '#expand' : '#hire', title: '訂單快做不完了', text: '這條是「這個月的訂單 / 你們做得完的量」。做不完的話，口碑和士氣會掉。', todo: () => seatsFull() ? '座位滿了：先點「擴張辦公室」' : '點一下「招募 1 人」', done: c => S.staff.length > c.staff || S.office > c.office },
  { id: 'reveal', when: () => flags.revealPending, target: '#toast', title: '這是結果', text: '右下角是剛才決定的結果。「原則」是背後的經營道理，最後的成績單也會用到。', then: () => { flags.revealPending = false; $('toast').hidden = true; } },
  { id: 'fast', after: 'reveal', reveal: ['fast'], target: '[data-x="2"]', title: '可以加速了', text: '熟悉之後，可以用 2x、4x 讓時間走快一點。有突發狀況時一樣會停下來。' },
  { id: 'ads', after: 'rival', when: () => S.t >= 5, reveal: ['ads'], target: '#adsBox', title: '花錢買曝光', text: '廣告會帶來更多客人，但每個月都要花錢。上面多了一條「現金還能撐幾個月」。', todo: '拖動滑桿試試看（拉回 0 也可以）', done: () => flags.adsTouched },
  { id: 'goal', after: 'ads', when: () => S.t >= 8, reveal: ['goal'], target: '#goalBar', title: '今年的目標', text: '這條是今年營收和目標。年底會看有沒有達標，落後時想想是客人不夠還是做不完。' },
  { id: 'records', after: 'goal', when: () => S.t >= 18, reveal: ['records'], target: '#recordsBox', title: '回頭看紀錄', text: '這裡可以看營收圖和每個月發生的事。教學到這裡結束，按「玩法」可以隨時看規則。', then: () => storeSet(MODE_KEY, 'pro') },
];
function checkCoach() {
  if (mode !== 'new' || coach || !S || S.phase === 'end' || !$('overlay').hidden) return;
  const step = STEPS.find(x => !seen[x.id] && (!x.after || seen[x.after]) && (!x.when || x.when()) && (x.todo || x.auto || flags.lastInfo !== S.t || x.id === 'reveal' || x.id === 'points'));
  if (step) showCoach(step);
}
function showCoach(step) {
  seen[step.id] = true;
  if (step.reveal) unlock(...step.reveal);
  coach = { ...step, staff: S.staff.length, office: S.office };
  const todo = typeof step.todo === 'function' ? step.todo() : step.todo;
  if (!todo) flags.lastInfo = S.t;
  $('coach').innerHTML = `<h3>${step.title}</h3><p>${step.text}</p>${todo ? `<div class="todo">→ ${todo}</div>` : ''}<div class="row"><button class="skip" id="coachSkip">不用教了</button>${todo || step.auto ? '' : '<button class="primary" id="coachOk">知道了</button>'}</div>`;
  $('coach').hidden = false;
  if ($('coachOk')) $('coachOk').onclick = closeCoach;
  $('coachSkip').onclick = () => { closeCoach(); mode = 'pro'; storeSet(MODE_KEY, 'pro'); open = new Set(ALL); if (S.t === 0 && !open.has('started')) open.add('started'); applyLocks(); render(); };
  if (step.auto) setTimeout(() => coach && coach.id === step.id && closeCoach(), step.auto);
  const el = target(); if (el) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
  placeCoach();
}
function target() { if (!coach) return null; const t = typeof coach.target === 'function' ? coach.target() : coach.target; return t && document.querySelector(t); }
function placeCoach() {
  if (coach.done && coach.done(coach)) return closeCoach();
  document.querySelectorAll('.glow').forEach(x => x.classList.remove('glow'));
  const el = target(), card = $('coach'), ptr = $('pointer');
  const todo = typeof coach.todo === 'function' ? coach.todo() : coach.todo;
  const spot = $('spot');
  if (!el) { spot.hidden = true; ptr.hidden = true; card.style.left = (innerWidth - card.offsetWidth) / 2 + 'px'; card.style.top = '90px'; return; }
  el.classList.add('glow');
  const r = el.getBoundingClientRect(), pad = 6;
  spot.hidden = false; Object.assign(spot.style, { left: r.left - pad + 'px', top: r.top - pad + 'px', width: r.width + pad * 2 + 'px', height: r.height + pad * 2 + 'px' });
  // 「點這裡」標籤：上方有空間放上方，否則放下方
  ptr.hidden = !todo;
  const ptrAbove = r.top - ptr.offsetHeight - 10 >= 4, gap = todo && !ptrAbove ? ptr.offsetHeight + 18 : 16;
  if (todo) {
    ptr.textContent = ptrAbove ? '點這裡 ↓' : '點這裡 ↑';
    ptr.style.left = Math.min(Math.max(4, r.left + r.width / 2 - ptr.offsetWidth / 2), innerWidth - ptr.offsetWidth - 4) + 'px';
    ptr.style.top = (ptrAbove ? r.top - ptr.offsetHeight - 10 : r.bottom + 10) + 'px';
  }
  // 提示卡不能蓋住目標：窄螢幕放在目標的另一半畫面，寬螢幕放在目標下方或上方
  if (innerWidth < 600) {
    card.style.left = '16px';
    card.style.top = (r.top + r.height / 2 > innerHeight / 2 ? 12 : innerHeight - card.offsetHeight - 16) + 'px';
    return;
  }
  const below = r.bottom + gap + card.offsetHeight < innerHeight;
  card.style.left = Math.min(Math.max(16, r.left + r.width - card.offsetWidth), innerWidth - card.offsetWidth - 16) + 'px';
  card.style.top = (below ? r.bottom + gap : Math.max(16, r.top - card.offsetHeight - 44)) + 'px';
}
function closeCoach() {
  const c = coach; coach = null;
  $('coach').hidden = true; $('spot').hidden = true; $('pointer').hidden = true;
  document.querySelectorAll('.glow').forEach(x => x.classList.remove('glow'));
  if (c?.then) c.then();
  if (S) render();
}

function helpCard() {
  dialog(`<div class="help"><h2>玩法</h2>
    <h3>目標</h3><p>經營彩色寶石公司，從 2019 年做到 2025 年底。做得好可以上市：要有「上市申請」能力、最後一年營收 2.5 億以上、有賺錢、士氣 45 以上。</p>
    <h3>兩種會提早結束</h3><p>對手的客人到 60%，或現金用完。</p>
    <h3>每個月發生什麼</h3><p>有人看到你 → 來詢問 → 下單 → 變成熟客；熟客會再介紹新客人。對手同時在搶客人。訂單多到做不完時，口碑和士氣會掉。</p>
    <h3>你可以做的事</h3><ul><li>點金色圓球拿口碑點，用口碑點＋現金買能力</li><li>調整每月廣告預算</li><li>招募、資遣、擴張辦公室</li><li>每年初指派商品、通路、組織三位負責人</li><li>處理突發狀況：沒有標準答案，看當下的訂單、現金、口碑再選；有「先查證」就先查</li></ul>
    <h3>最後的成績單</h3><p>結束時會列出七項表現，例如現金最緊的時候、做不完的月數，每項附一句經營道理。</p>
    <div class="choices"><button class="primary" id="helpClose">回到遊戲</button></div></div>`);
  $('helpClose').onclick = () => { closeDialog(); if (!S) startScreen(); else if (S.phase === 'decide') showDecision(); else if (S.phase === 'end') endScreen(); };
}

function loop(now) {
  const dt = now - last; last = now;
  if (S && S.phase === 'running' && open.has('started') && speed && !coach && $('overlay').hidden) {
    acc += dt * speed;
    if (acc >= V3.MONTH_MS) { acc = 0; V3.step(S); spawnBubbles(S.bubbles); render(); afterStep(); }
  }
  if (coach) placeCoach();
  requestAnimationFrame(loop);
}
$('playBtn').onclick = () => { unlock('started'); closeCoach(); };
$('speed').onclick = e => { const b = e.target.closest('button[data-x]'); if (!b) return; speed = +b.dataset.x; document.querySelectorAll('#speed button[data-x]').forEach(x => x.classList.toggle('on', x === b)); };
$('ads').oninput = e => { if (S) { V3.setAds(S, +e.target.value); flags.adsTouched = true; render(); } };
$('hire').onclick = () => { const err = V3.hire(S); if (err) toast(err); render(); };
$('fire').onclick = () => { const err = V3.fire(S); if (err) toast(err); render(); };
$('expand').onclick = () => { const err = V3.expand(S); if (err) toast(err); render(); };
$('helpBtn').onclick = helpCard;
applyLocks();
startScreen();
requestAnimationFrame(loop);
</script>
</body>
