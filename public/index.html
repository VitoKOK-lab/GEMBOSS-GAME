<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TZGRO 珠寶人生</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FBFBFC;--ink:#1d2b28;--muted:#6b7672;--line:#e3e4e8;--card:#fff;--emerald:#1F7A5C;--sapphire:#2B4C9B;--ruby:#B3324A;--amethyst:#7A4FA0;--citrine:#C9962B;--soft:#f2f3f6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 'Noto Sans TC',system-ui,sans-serif}
.num{font-family:'Space Mono',monospace;font-weight:700}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:7px 12px}
button:disabled{opacity:.4;cursor:not-allowed}
button.primary{background:var(--emerald);border-color:var(--emerald);color:#fff}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header .brand{font-weight:800;letter-spacing:.06em}
.stat small{display:block;color:var(--muted);font-size:11px}
.stat b{font-size:17px}
.speed{margin-left:auto;display:flex;gap:6px}
.speed button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.grid{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;margin-top:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.card h2{margin:0 0 10px;font-size:15px}
.bars{display:grid;gap:12px}
.bar{height:12px;border-radius:99px;background:var(--soft);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.barrow{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.danger{color:var(--ruby)}
#map{position:relative;height:300px;border-radius:14px;background:linear-gradient(160deg,#f6f2ea,#eef3f1);overflow:hidden}
.region{position:absolute;z-index:1;transform:translate(-50%,-50%);text-align:center;font-size:12px}
.region .dot{border-radius:50%;margin:0 auto 4px;display:grid;place-items:center;font-size:11px;color:#fff;box-shadow:0 6px 18px #0001}
.region.locked .dot{filter:grayscale(1);opacity:.45}
.bubble{position:absolute;z-index:2;width:42px;height:42px;border-radius:50%;border:0;padding:0;background:radial-gradient(circle at 35% 30%,#fff,var(--citrine));color:#5a3e00;font-weight:800;box-shadow:0 6px 16px #c9962b55;animation:pop .35s ease-out,float 3s ease-in-out infinite}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes float{50%{margin-top:-6px}}
.tree{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.branch h3{margin:0 0 6px;font-size:13px}
.node{display:block;width:100%;text-align:left;margin-bottom:6px;padding:7px 9px;font-size:12.5px;border-radius:10px}
.node small{display:block;color:var(--muted);font-size:11px}
.node.own{background:#e9f4ef;border-color:#bfe0d1}
.node.own small{color:var(--emerald)}
.product h3{color:var(--ruby)}.channel h3{color:var(--sapphire)}.org h3{color:var(--amethyst)}
.ops{display:grid;gap:10px}
.opsrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input[type=range]{width:100%;accent-color:var(--sapphire)}
.rooms{display:flex;gap:6px;flex-wrap:wrap}
.room{padding:6px 9px;border-radius:9px;background:var(--soft);font-size:12px;color:var(--muted)}
.room.on{background:#fbefd7;color:#6b4b00}
#log{max-height:220px;overflow:auto;font-size:12.5px;color:var(--muted)}
#log div{padding:3px 0;border-bottom:1px dashed var(--line)}
canvas{width:100%;height:120px}
.overlay{position:fixed;inset:0;background:#1d2b2844;display:grid;place-items:center;z-index:10;padding:16px}
.overlay[hidden]{display:none}
.dialog{background:var(--card);border-radius:18px;max-width:560px;width:100%;padding:22px;max-height:90vh;overflow:auto}
.dialog h2{margin:0 0 8px}
.dialog p{white-space:pre-line}
.choices{display:grid;gap:8px;margin-top:14px}
.choices button{text-align:left;padding:10px 12px}
.starts{display:grid;gap:8px;margin:10px 0}
.starts label{display:block;border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}
.starts input{margin-right:6px}
.toast{position:fixed;right:16px;bottom:16px;max-width:360px;background:var(--ink);color:#fff;border-radius:14px;padding:12px 14px;font-size:13px;z-index:9;box-shadow:0 10px 30px #0003}
.toast b{color:#f5d68a}
.toast[hidden]{display:none}
.diag{display:grid;gap:8px;margin-top:10px}
.diag div{border:1px solid var(--line);border-radius:12px;padding:9px 11px;font-size:13px}
.diag .bad{border-color:#e9b9c2;background:#fdf3f5}
.diag em{font-style:normal;color:var(--muted);display:block}
.leads{display:grid;gap:8px}
.leads label{display:flex;justify-content:space-between;gap:10px;align-items:center}
.leads select{font:inherit;padding:5px;border-radius:8px;border:1px solid var(--line)}
#spot{position:fixed;z-index:20;border-radius:14px;box-shadow:0 0 0 9999px #1d2b2899,0 0 0 3px var(--citrine) inset;pointer-events:none;transition:all .25s}
#spot[hidden],#coach[hidden]{display:none}
#coach{position:fixed;z-index:21;width:min(360px,calc(100vw - 32px));background:var(--card);border-radius:16px;padding:16px;box-shadow:0 14px 40px #0003}
#coach h3{margin:0 0 6px;font-size:16px}
#coach p{margin:0 0 12px;font-size:14px}
#coach .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
#coach .skip{border:0;background:none;color:var(--muted);font-size:12px;padding:4px}
#coach .wait{color:var(--emerald);font-weight:700;font-size:13px}
.tip{background:#fbf3df;border-radius:12px;padding:10px 12px;font-size:13.5px;margin:8px 0}
.tip b{color:#6b4b00}
.help h3{margin:14px 0 4px;font-size:14px}
.help p,.help li{font-size:14px;margin:2px 0}
@media(max-width:600px){#coach{left:16px!important;right:16px;top:auto!important;bottom:16px}}
@media(max-width:860px){.grid{grid-template-columns:1fr}.tree{grid-template-columns:1fr}header{gap:8px 14px}.speed{margin-left:0}}
</style>
</head>
<body>
<header>
  <div class="brand">TZGRO 珠寶人生</div>
  <div class="stat"><small>日期</small><b class="num" id="date">—</b></div>
  <div class="stat"><small>現金</small><b class="num" id="cash">—</b></div>
  <div class="stat"><small>本月營收</small><b class="num" id="rev">—</b></div>
  <div class="stat"><small>口碑點</small><b class="num" id="pts">—</b></div>
  <div class="stat"><small>口碑／士氣</small><b class="num" id="bm">—</b></div>
  <button id="helpBtn">玩法</button>
  <div class="speed" id="speed"><button data-x="0">暫停</button><button data-x="1" class="on">1x</button><button data-x="2">2x</button><button data-x="4">4x</button></div>
</header>
<div class="wrap">
  <div class="grid">
    <section class="card">
      <h2>市場版圖　<small style="color:var(--muted);font-weight:400">點金色泡泡收成口碑點</small></h2>
      <div id="map"></div>
      <div class="bars" style="margin-top:14px">
        <div><div class="barrow"><span>你 vs 對手市占</span><span class="num" id="shareText"></span></div><div class="bar"><i id="mine" style="background:var(--emerald)"></i><i style="flex:1"></i><i id="comp" style="background:var(--ruby)"></i></div><div class="barrow" style="font-size:11px;color:var(--muted)"><span>對手拿下 60% → 品類被定義，遊戲結束</span></div></div>
        <div><div class="barrow"><span>現金跑道</span><span class="num" id="runText"></span></div><div class="bar"><i id="run" style="background:var(--citrine)"></i></div></div>
        <div><div class="barrow"><span>今年營收／目標</span><span class="num" id="goalText"></span></div><div class="bar"><i id="goal" style="background:var(--sapphire)"></i></div></div>
        <div><div class="barrow"><span>訂單／出貨產能</span><span class="num" id="capText"></span></div><div class="bar"><i id="cap" style="background:var(--amethyst)"></i></div></div>
      </div>
    </section>
    <section class="card ops">
      <h2>經營操作</h2>
      <div><div class="barrow"><span>每月廣告預算</span><span class="num" id="adText"></span></div><input type="range" id="ads" min="0" max="3000000" step="50000" value="0"></div>
      <div class="opsrow"><button id="hire">招募 1 人</button><button id="fire">資遣 1 人</button><button id="expand">擴張辦公室</button><span id="team" style="font-size:13px;color:var(--muted)"></span></div>
      <div class="rooms" id="rooms"></div>
      <h2 style="margin-top:6px">月營收</h2>
      <canvas id="chart" width="600" height="160"></canvas>
      <h2>紀錄</h2>
      <div id="log"></div>
    </section>
  </div>
  <section class="card" style="margin-top:16px">
    <h2>能力樹　<small style="color:var(--muted);font-weight:400">口碑點＋現金解鎖；部分能力依年份開放</small></h2>
    <div class="tree" id="tree"></div>
  </section>
</div>
<div class="overlay" id="overlay"><div class="dialog" id="dialog"></div></div>
<div class="toast" id="toast" hidden></div>
<div id="spot" hidden></div>
<div id="coach" hidden></div>
<script src="engine.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id), esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const POS = { north: [60, 28], south: [52, 64], hk: [24, 46], sg: [18, 78], jp: [84, 32] };
let S = null, speed = 1, acc = 0, last = performance.now(), toastTimer = 0;
const money = n => (n < 0 ? '-' : '') + 'NT$' + Math.round(Math.abs(n) / 10000).toLocaleString('zh-TW') + '萬';

function startScreen() {
  const starts = Object.entries(V3.STARTS).map(([k, v], i) => `<label><input type="radio" name="start" value="${k}" ${i ? '' : 'checked'}><b>${v.name}</b>　<span style="color:var(--muted)">${v.desc}</span></label>`).join('');
  const diffs = Object.entries(V3.DIFFICULTY).map(([k, v]) => `<label><input type="radio" name="diff" value="${k}" ${k === 'normal' ? 'checked' : ''}>${v.name}</label>`).join('');
  dialog(`<h2>從 2019 年開始，走到 2025 年底</h2>
    <p>讓客人像口碑一樣擴散：觸及 → 詢問 → 成交 → 熟客，熟客再帶來新客。對手同時在搶市場，現金燒完或對手拿下六成市場就結束。一局約 30–45 分鐘。</p>
    <h3>開局</h3><div class="starts">${starts}</div>
    <h3>難度</h3><div class="starts" style="grid-template-columns:repeat(3,1fr)">${diffs}</div>
    <label style="display:block;margin-top:12px"><input type="checkbox" id="tutOn" ${tutorialDone() ? '' : 'checked'}> 新手教學（建議第一次玩）</label>
    <div class="choices"><button class="primary" id="go">開始經營</button><button id="startHelp">先看玩法</button></div>`);
  $('startHelp').onclick = helpCard;
  $('go').onclick = () => {
    tut = { on: $('tutOn').checked, seen: {} };
    S = V3.create({ start: document.querySelector('[name=start]:checked').value, difficulty: document.querySelector('[name=diff]:checked').value, seed: Date.now() >>> 0 });
    closeDialog(); render(); showDecision();
  };
}
function dialog(html) { $('dialog').innerHTML = html; $('overlay').hidden = false; }
function closeDialog() { $('overlay').hidden = true; }
function toast(html) { $('toast').innerHTML = html; $('toast').hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => $('toast').hidden = true, 7000); }

function showDecision() {
  const e = S.queue[0];
  if (!e) return;
  if (e.type === 'era') {
    const g = S.metrics.goals.at(-1), opts = id => S.staff.map(p => `<option value="${p.id}" ${S.leads[id] === p.id ? 'selected' : ''}>${esc(p.name)}（${V3.BRANCH[id]} ${p.skill[id]}）</option>`).join('') + `<option value="" ${S.leads[id] ? '' : 'selected'}>（從缺）</option>`;
    dialog(`<h2>${V3.view(S).year} 年開始</h2>
      ${g ? `<p>${g.year} 年營收 <b class="num">${money(g.revenue)}</b>／目標 ${money(g.goal)}　${g.hit ? '✓ 達成' : '未達成'}</p>` : '<p>指派三位負責人。一人兼兩職會分心，從缺的部門效率最低。</p>'}
      <p>今年目標：<b class="num">${money(V3.ERA_GOALS[Math.floor(S.t / 12)])}</b>　年度結算 +2 口碑點</p>
      ${tipOnce(S.t === 0 ? 'leads' : 'year', S.t === 0
        ? '<b>教學</b>　三位負責人分別管商品、通路、組織。括號裡的數字是能力，越高效果越好；同一人兼兩職會分心，從缺最差。先照預設就可以。'
        : S.t === 12 ? '<b>教學</b>　每年初看去年有沒有達標、指派今年的負責人，並拿到 +2 口碑點。達標不是過關條件，是檢查點：落後時想想瓶頸在觸及、轉換還是產能。' : '')}
      <div class="leads">${['product', 'channel', 'org'].map(id => `<label>${V3.BRANCH[id]}負責人<select data-slot="${id}">${opts(id)}</select></label>`).join('')}</div>
      <div class="choices"><button class="primary" id="eraOk">開始這一年</button></div>`);
    $('eraOk').onclick = () => { document.querySelectorAll('[data-slot]').forEach(x => x.value ? V3.assign(S, x.dataset.slot, x.value) : (S.leads[x.dataset.slot] = null)); const wasYearTwo = S.t === 12; V3.confirmEra(S); closeDialog(); if (wasYearTwo && tut.on) finishTutorial(); render(); showDecision(); };
    return;
  }
  dialog(`<h2>${esc(e.title)}</h2><p>${esc(e.text)}</p>
    ${tipOnce('event', '<b>教學</b>　事件會暫停時間等你決定。同一種事件沒有標準答案：先看現在的產能、現金跑道、口碑；有「查證」就先查證。結果會在右下角揭曉。')}
    ${e.verify && !e.verified ? '<div class="choices"><button id="verify">先查證（1 口碑點）</button></div>' : ''}
    <div class="choices">${e.choices.map(([id, label]) => `<button data-c="${id}">${esc(label)}</button>`).join('')}</div>`);
  if ($('verify')) $('verify').onclick = () => { const err = V3.verify(S); if (err) toast(err); showDecision(); render(); };
  document.querySelectorAll('[data-c]').forEach(b => b.onclick = () => {
    const err = V3.choose(S, b.dataset.c); if (err) return toast(err);
    closeDialog();
    const r = S.reveals.shift(); if (r) toast(`<div>${esc(r.result)}</div><div style="margin-top:6px"><b>原則</b>　${esc(r.principle)}</div>`);
    if (r && tut.on && !tut.seen.reveal) { tut.seen.reveal = true; clearTimeout(toastTimer); showCoach({ target: '#toast', title: '結果揭曉', text: '右下角是這次決策的結果。「原則」是背後的經營道理，一局結束時的診斷報告也會用到。', onClose: () => $('toast').hidden = true }); }
    render(); afterStep();
  });
}
function afterStep() {
  if (S.phase === 'end') return endScreen();
  if (S.phase === 'decide') showDecision();
}
function endScreen() {
  const e = V3.ENDINGS[S.ending], d = V3.diagnose(S);
  dialog(`<h2>${e.title}</h2><p>${e.text}（${V3.ym(Math.max(0, S.t - 1))}）</p>
    <h3>經營診斷</h3><div class="diag">${d.map(x => `<div class="${x.ok ? '' : 'bad'}"><b>${x.key}</b>　<span class="num">${esc(x.value)}</span><em>${esc(x.principle)}</em></div>`).join('')}</div>
    <div class="choices"><button class="primary" id="again">再玩一局</button></div>`);
  $('again').onclick = startScreen;
}

function spawnBubbles(n) {
  const map = $('map');
  for (let i = 0; i < n; i++) {
    const b = document.createElement('button'); b.className = 'bubble'; b.textContent = '+1';
    b.style.left = 8 + Math.random() * 80 + '%'; b.style.top = 10 + Math.random() * 70 + '%';
    b.onclick = () => { V3.collect(S, 1); b.remove(); render(); };
    map.appendChild(b);
    const expire = () => coach ? setTimeout(expire, 500) : b.remove();
    setTimeout(expire, 8000 / Math.max(1, speed));
  }
}

function render() {
  if (!S) return;
  const v = V3.view(S), h = v.h;
  $('date').textContent = v.date; $('cash').textContent = money(S.cash); $('rev').textContent = money(h.revenue);
  $('pts').textContent = S.points; $('bm').textContent = Math.round(S.brand) + '／' + Math.round(S.morale);
  $('mine').style.width = h.share * 100 + '%'; $('comp').style.width = h.comp * 100 + '%';
  $('shareText').innerHTML = `<span style="color:var(--emerald)">${(h.share * 100).toFixed(1)}%</span> vs <span class="${h.comp > .45 ? 'danger' : ''}">${(h.comp * 100).toFixed(1)}%</span>`;
  const run = Math.min(24, v.runway); $('run').style.width = run / 24 * 100 + '%';
  $('runText').innerHTML = v.runway >= 99 ? '獲利中' : `<span class="${v.runway < 4 ? 'danger' : ''}">${v.runway.toFixed(1)} 個月</span>`;
  $('goal').style.width = Math.min(100, v.yearRevenue / v.goal * 100) + '%'; $('goalText').textContent = `${money(v.yearRevenue)}／${money(v.goal)}`;
  $('cap').style.width = Math.min(100, h.orders / Math.max(1, v.capacity) * 100) + '%'; $('cap').style.background = h.orders > v.capacity ? 'var(--ruby)' : 'var(--amethyst)';
  $('capText').innerHTML = `<span class="${h.orders > v.capacity ? 'danger' : ''}">${Math.round(h.orders)}／${Math.round(v.capacity)} 單</span>`;
  $('adText').textContent = money(S.adBudget); $('ads').value = S.adBudget;
  $('team').textContent = `${S.staff.length}/${v.seats} 人・${v.room}`;
  $('hire').disabled = S.staff.length >= v.seats;
  $('expand').disabled = !v.expandFee; $('expand').textContent = v.expandFee ? `擴張辦公室（${money(v.expandFee)}，${v.expandYear} 年起）` : '辦公室已最大';
  $('rooms').innerHTML = V3.ROOMS.map((r, i) => `<span class="room ${i <= S.office ? 'on' : ''}">${r}・${V3.SEATS[i]} 席</span>`).join('');
  // 版圖
  const map = $('map'); map.querySelectorAll('.region').forEach(x => x.remove());
  for (const r of S.regions) {
    const def = V3.REGIONS.find(x => x.id === r.id), open = V3.isOpen(S, r), mine = (r.C + r.L) / r.N, comp = r.K / r.N, size = (40 + Math.sqrt(r.N) / 2.6) * Math.min(1, map.clientWidth / 560);
    const el = document.createElement('div'); el.className = 'region' + (open ? '' : ' locked');
    el.style.left = POS[r.id][0] + '%'; el.style.top = POS[r.id][1] + '%';
    el.innerHTML = `<div class="dot" style="width:${size}px;height:${size}px;background:conic-gradient(var(--emerald) 0 ${mine * 360}deg,#d9dde3 ${mine * 360}deg ${360 - comp * 360}deg,var(--ruby) ${360 - comp * 360}deg)"><span class="num" style="background:#0006;padding:1px 5px;border-radius:6px">${Math.round(mine * 100)}%</span></div><b>${def.name}</b>${open ? '' : `<div style="color:var(--muted)">需「${V3.byId[def.unlock].name}」</div>`}`;
    map.appendChild(el);
  }
  // 能力樹
  $('tree').innerHTML = ['product', 'channel', 'org'].map(b => `<div class="branch ${b}"><h3>${V3.BRANCH[b]}</h3>${V3.NODES.filter(n => n.branch === b).map(n => {
    const own = V3.has(S, n.id), ok = V3.available(S, n.id), afford = ok && S.points >= n.pts && S.cash >= n.cash;
    const meta = own ? '已擁有' : V3.view(S).year < n.year ? `${n.year} 年開放` : !n.req.every(r => V3.has(S, r)) ? '需先完成：' + n.req.map(r => V3.byId[r].name).join('、') : `${n.pts} 點・${money(n.cash)}`;
    return `<button class="node ${own ? 'own' : ''}" data-node="${n.id}" ${own || !afford ? 'disabled' : ''} title="${esc(n.desc)}"><b>${n.name}</b><small>${meta}</small><small>${esc(n.desc)}</small></button>`;
  }).join('')}</div>`).join('');
  document.querySelectorAll('[data-node]').forEach(b => b.onclick = () => { const err = V3.buy(S, b.dataset.node); if (err) toast(err); render(); });
  $('log').innerHTML = S.log.slice(0, 40).map(l => `<div><span class="num">${l.date}</span>　${esc(l.text)}</div>`).join('');
  chart();
  checkCoach();
}
function chart() {
  const c = $('chart'), x = c.getContext('2d'), w = c.width, h = c.height, data = S.history.map(d => d.revenue);
  x.clearRect(0, 0, w, h); if (data.length < 2) return;
  const max = Math.max(...data) * 1.1;
  x.strokeStyle = '#2B4C9B'; x.lineWidth = 3; x.beginPath();
  data.forEach((d, i) => { const px = i / (V3.MONTHS - 1) * w, py = h - d / max * (h - 10) - 5; i ? x.lineTo(px, py) : x.moveTo(px, py); });
  x.stroke();
  x.fillStyle = '#6b7672'; x.font = '18px Space Mono'; x.fillText(money(max / 1.1), 6, 20);
}

function loop(now) {
  const dt = now - last; last = now;
  if (S && S.phase === 'running' && speed && !coach && $('overlay').hidden) {
    acc += dt * speed;
    if (acc >= V3.MONTH_MS) { acc = 0; V3.step(S); spawnBubbles(S.bubbles); render(); afterStep(); }
  }
  if (coach) placeCoach();
  requestAnimationFrame(loop);
}
$('speed').onclick = e => { const b = e.target.closest('button'); if (!b) return; speed = +b.dataset.x; document.querySelectorAll('#speed button').forEach(x => x.classList.toggle('on', x === b)); };
$('ads').oninput = e => { if (S) { V3.setAds(S, +e.target.value); render(); } };
$('hire').onclick = () => { const err = V3.hire(S); if (err) toast(err); render(); };
$('fire').onclick = () => { const err = V3.fire(S); if (err) toast(err); render(); };
$('expand').onclick = () => { const err = V3.expand(S); if (err) toast(err); render(); };
// ── 新手教學：事情第一次發生時暫停、聚光、說一句、等玩家做一次 ──
let tut = { on: false, seen: {} }, coach = null;
const TUT_KEY = 'tzgro-v3-tutorial-done';
function tutorialDone() { try { return localStorage.getItem(TUT_KEY) === '1'; } catch { return false; } }
function tipOnce(id, html) { if (!tut.on || !html || tut.seen[id]) return ''; tut.seen[id] = true; return `<div class="tip">${html}</div>`; }
const capHigh = () => { const h = S.history.at(-1); return h && h.orders > h.capacity * .8; };
const STEPS = [
  { id: 'goal', when: () => true, title: '你的目標', text: '從 2019 年經營到 2025 年底，越做越大，最好能上市。兩種情況會提早結束：對手拿下六成市場，或現金燒完。' },
  { id: 'map', when: () => true, target: '#map', title: '市場版圖', text: '每個圓是一個市場。綠色是你的客人、紅色是對手、灰色是還沒被拿下的客人。灰色地區要靠能力樹開拓，晚開拓就會先被對手搶走。' },
  { id: 'bars', when: () => true, target: '.bars', title: '四條要盯的指標', text: '市占：你和對手的拉鋸。現金跑道：還能撐幾個月。今年營收／目標：年度檢查點。訂單／產能：變紅代表出貨跟不上，口碑和士氣會掉。' },
  { id: 'speed', when: () => true, target: '#speed', title: '時間會自己走', text: '一個月約 20 秒，可以暫停或加速。有事件時會自動暫停等你決定。', btn: '開始第一個月' },
  { id: 'bubble', when: () => document.querySelector('.bubble'), target: '.bubble', title: '收成口碑點', text: '客人成交、熟客回購時會冒出金色泡泡，點它就得到口碑點。泡泡會消失，別放著。', wait: () => S.points > coach.points },
  { id: 'tree', when: () => V3.available(S, 'select') && S.points >= V3.byId.select.pts && S.cash >= V3.byId.select.cash, target: '[data-node=select]', title: '用口碑點解鎖能力', text: '買「精選主打」，提高成交率。口碑點有限，整棵樹買不完，順序要自己想。', wait: () => V3.has(S, 'select') },
  { id: 'expand', when: () => capHigh() && S.staff.length >= V3.view(S).seats && V3.view(S).expandFee && V3.view(S).year >= V3.view(S).expandYear && S.cash >= V3.view(S).expandFee, target: '#expand', title: '訂單快接不住了', text: '訂單已超過產能八成，但座位滿了。先擴張辦公室，才有位子招人。', wait: () => S.office > coach.office },
  { id: 'hire', when: () => capHigh() && S.staff.length < V3.view(S).seats, target: '#hire', title: '招人擴充產能', text: '多一個人就多一份出貨產能，但每月多一份薪水。新人第一個月只有半個人的產能。', wait: () => S.staff.length > coach.staff },
  { id: 'ads', when: () => S.t >= 4, target: '#ads', title: '廣告預算', text: '拉滑桿就是每月花錢買詢問。市場越飽和越貴；產能接不住或現金跑道少於 4 個月時，先別加。' },
];
function checkCoach() {
  if (!tut.on || coach || !S || S.phase === 'end' || !$('overlay').hidden) return;
  const intro = ['goal', 'map', 'bars', 'speed'];
  const step = STEPS.find(x => !tut.seen[x.id] && (intro.includes(x.id) || intro.every(i => tut.seen[i])) && x.when());
  if (step) showCoach(step);
}
function showCoach(step) {
  if (step.id) tut.seen[step.id] = true;
  coach = { ...step, points: S.points, office: S.office, staff: S.staff.length };
  const el = step.target && document.querySelector(step.target);
  if (el) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
  $('coach').innerHTML = `<h3>${step.title}</h3><p>${step.text}</p><div class="row"><button class="skip" id="coachSkip">跳過教學</button>${step.wait ? '<span class="wait">請點亮起來的地方</span>' : `<button class="primary" id="coachOk">${step.btn || '知道了'}</button>`}</div>`;
  $('coach').hidden = false;
  if ($('coachOk')) $('coachOk').onclick = closeCoach;
  $('coachSkip').onclick = () => { closeCoach(); finishTutorial(true); };
  placeCoach();
}
function placeCoach() {
  if (coach.wait && coach.wait()) return closeCoach();
  const el = coach.target && document.querySelector(coach.target), spot = $('spot'), card = $('coach');
  if (coach.target && !el) return closeCoach();
  if (!el) { spot.hidden = true; card.style.left = (innerWidth - card.offsetWidth) / 2 + 'px'; card.style.top = Math.max(16, (innerHeight - card.offsetHeight) / 2) + 'px'; return; }
  const r = el.getBoundingClientRect(), pad = 6;
  spot.hidden = false; Object.assign(spot.style, { left: r.left - pad + 'px', top: r.top - pad + 'px', width: r.width + pad * 2 + 'px', height: r.height + pad * 2 + 'px' });
  const below = r.bottom + 14 + card.offsetHeight < innerHeight;
  card.style.left = Math.min(Math.max(16, r.left), innerWidth - card.offsetWidth - 16) + 'px';
  card.style.top = (below ? r.bottom + 14 : Math.max(16, r.top - card.offsetHeight - 14)) + 'px';
}
function closeCoach() {
  const c = coach; coach = null; $('coach').hidden = true; $('spot').hidden = true;
  if (c?.onClose) c.onClose();
  if (S) render();
}
function finishTutorial(skipped) {
  try { localStorage.setItem(TUT_KEY, '1'); } catch {}
  if (skipped) { tut.on = false; return; }
  // 還沒遇到的情況（例如產能第一次吃緊），之後第一次發生時仍會提示
  showCoach({ title: '教學完成', text: '基本操作都會了。接下來自己經營到 2025 年底；還沒遇到的狀況，第一次發生時會再提示。忘記規則時，按右上角「玩法」可以重看。' });
}
function helpCard() {
  dialog(`<div class="help"><h2>玩法</h2>
    <h3>目標</h3><p>從 2019 年經營到 2025 年底。成功上市需要：完成「上市申請」、最後一年營收 2.5 億以上、有獲利、士氣 45 以上。</p>
    <h3>兩種提早結束</h3><p>對手拿下六成市場（品類被定義），或現金低於零（破產）。</p>
    <h3>每個月發生什麼</h3><p>客人依序走過：觸及 → 詢問 → 成交 → 熟客；熟客的口碑再帶來新的觸及。對手同時在搶還沒被拿下的客人。訂單超過出貨產能時，口碑和士氣會下滑。</p>
    <h3>你能做的事</h3><ul><li>點金色泡泡收成口碑點，用點數＋現金解鎖能力樹</li><li>調整每月廣告預算</li><li>招募、資遣、擴張辦公室（座位依年份開放）</li><li>每年初指派商品、通路、組織三位負責人</li><li>處理事件與真實新聞：沒有標準答案，看當下的產能、現金、口碑；能查證就先查證</li></ul>
    <h3>結局診斷</h3><p>一局結束會列出七項指標，例如現金跑道最低點、獲客成本對客人價值、產能超載月數，每項附一句經營原則。</p>
    <div class="choices"><button class="primary" id="helpClose">回到遊戲</button></div></div>`);
  $('helpClose').onclick = () => { closeDialog(); if (!S) startScreen(); else if (S.phase === 'decide') showDecision(); else if (S.phase === 'end') endScreen(); };
}
$('helpBtn').onclick = helpCard;
startScreen();
requestAnimationFrame(loop);
</script>
