<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TZGRO｜擴建後辦公室活動預覽</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:system-ui,"Noto Sans TC",sans-serif;background:#f0eaff;color:#352548}.shell{height:100dvh;display:flex;flex-direction:column}.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;background:#fffafc;box-shadow:0 3px 18px #3c2b5720;z-index:1}.bar strong{font-size:16px}.bar small{display:block;color:#786b87;font-size:12px;margin-top:3px}.bar a{color:#694b94;text-decoration:none;font-weight:700;font-size:12px}.light-controls{display:flex;gap:6px}.light-controls button{border:1px solid #d8bec2;background:#fff5f3;color:#754553;border-radius:16px;padding:7px 11px;font-weight:700;cursor:pointer}.light-controls button[aria-pressed="true"]{background:#713b5b;color:white}.scene{flex:1;min-height:0;width:100%;border:0}.hint{position:absolute;right:18px;bottom:18px;padding:9px 12px;border-radius:12px;background:#fffafcdd;color:#614f76;font-size:12px;pointer-events:none}</style></head><body><main class="shell"><header class="bar"><div><strong>TZGRO｜辦公室日夜與工作活動預覽</strong><small>示意編制：一樓選品、客服與出貨；二樓行銷、剪輯、營運。場景與人物共用 3D 座標。</small></div><div class="light-controls"><button data-time="11:00" aria-pressed="false">白天</button><button data-time="17:30" aria-pressed="false">傍晚</button><button data-time="19:00" aria-pressed="false">夜景</button></div><a href="../index.html">回到遊戲 →</a></header><iframe class="scene" title="兩層辦公室工作動畫" src="scene.html"></iframe></main><div class="hint">點人物名牌查看動作・正式遊戲從三人起步</div><script>
const frame=document.querySelector('iframe');
const people=[
{name:'Regina',role:'創辦人・採購選品'},{name:'怡安',role:'行銷客服'},{name:'若晴',role:'特助包裝出貨'},
{name:'選品04',role:'選品'},{name:'客服05',role:'行銷客服'},{name:'出貨06',role:'包裝出貨'},
{name:'行銷07',role:'行銷'},{name:'剪輯08',role:'剪輯'},{name:'剪輯09',role:'剪輯'},
{name:'營運10',role:'營運'},{name:'人資11',role:'HR人資'},{name:'企劃12',role:'行銷企劃'}];
let time='11:00';function sendScene(){frame.contentWindow.postMessage({type:'tycoon-scene',paused:false,busy:true,orders:86,people,count:people.length,level:2,workday:{active:true,action:'working',cycle:1,weekday:'週三',time},moods:Object.fromEntries(people.map((p,i)=>[p.name,65+i*2]))},location.origin);document.querySelectorAll('[data-time]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.time===time)));}document.querySelectorAll('[data-time]').forEach(b=>b.addEventListener('click',()=>{time=b.dataset.time;sendScene();}));
window.addEventListener('message',event=>{if(event.origin!==location.origin||event.source!==frame.contentWindow)return;if(event.data?.type==='tycoon-ready')sendScene();if(event.data?.type==='tycoon-person')document.querySelector('.hint').textContent=event.data.name+'｜'+(event.data.activity||'工作中');});
</script></body></html>
