function act(fn){const error=fn();if(error){toast(error);return false;}save();render();return true;}
function live(){const f=S.run?.forecast,portion=S.phase==='running'||S.phase==='event'?S.elapsed/Game.WEEK_MS:0;return {portion,revenue:(f?.revenue||0)*portion,net:(f?.net||0)*portion,orders:Math.floor((f?.orders||0)*portion)};}
function syncMusic(){const a=$('bgm'),b=$('musicToggle');if(!a||!b)return;b.textContent=musicOn?'♫ 音樂播放中':'♫ 播放音樂';b.setAttribute('aria-pressed',String(musicOn));if(musicOn){a.play().catch(()=>{musicOn=false;b.textContent='♫ 點此播放音樂';b.setAttribute('aria-pressed','false');});}else a.pause();}
function ensureAudio(){if(!soundOn)return null;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;audioCtx ||= new C();if(audioCtx.state==='suspended')audioCtx.resume().catch(()=>{});return audioCtx;}catch{return null;}}
function note(freq,when,duration=.14,volume=.035,wave='sine'){const c=ensureAudio();if(!c)return;const o=c.createOscillator(),g=c.createGain();o.type=wave;o.frequency.setValueAtTime(freq,when);g.gain.setValueAtTime(.0001,when);g.gain.exponentialRampToValueAtTime(volume,when+.012);g.gain.exponentialRampToValueAtTime(.0001,when+duration);o.connect(g);g.connect(c.destination);o.start(when);o.stop(when+duration+.02);}
function rustle(duration=.12,volume=.008,filter=2100){const c=ensureAudio();if(!c)return;const length=Math.max(1,Math.floor(c.sampleRate*duration)),buffer=c.createBuffer(1,length,c.sampleRate),data=buffer.getChannelData(0);for(let i=0;i<length;i++)data[i]=(Math.random()*2-1)*(1-i/length);const src=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();src.buffer=buffer;f.type='lowpass';f.frequency.value=filter;g.gain.value=volume;src.connect(f);f.connect(g);g.connect(c.destination);src.start();}
function playSfx(kind){if(!soundOn)return;const c=ensureAudio();if(!c)return;const t=c.currentTime+.015;switch(kind){case'work':note(1150+Math.random()*350,t,.025,.006,'square');if(workStep%9===0)rustle(.18,.006,1500);break;case'message':note(740,t,.11,.024,'triangle');note(988,t+.09,.13,.018,'sine');break;case'event':note(540,t,.14,.03,'sine');note(680,t+.12,.2,.028,'sine');break;case'news':note(784,t,.24,.04,'sine');note(988,t+.12,.25,.035,'sine');note(1175,t+.24,.34,.03,'sine');break;case'decision':note(620,t,.1,.025,'triangle');break;case'start':note(440,t,.09,.02,'sine');note(660,t+.08,.13,.024,'sine');break;case'week':note(659,t,.16,.03,'sine');note(784,t+.12,.16,.03,'sine');note(988,t+.24,.3,.035,'sine');break;}}
function syncSoundUI(){const b=$('sfxToggle');if(!b)return;b.textContent=soundOn?'◖)) 音效開':'◖)) 音效關';b.setAttribute('aria-pressed',String(soundOn));}
function syncWorkAudio(){const active=soundOn&&S.phase==='running'&&!paused&&!modalType&&!document.hidden;if(!active){clearTimeout(workTimer);workTimer=0;return;}if(workTimer)return;ensureAudio();const step=()=>{workTimer=0;if(!(soundOn&&S.phase==='running'&&!paused&&!modalType&&!document.hidden))return;workStep++;playSfx('work');workTimer=setTimeout(step,850+Math.random()*1050);};workTimer=setTimeout(step,650);}
function paint(){const l=live(),ch=Game.chapters[S.chapter],pulse=Game.ticker(S);syncMusic();syncSoundUI();if(lastTickerLine&&lastTickerLine!==pulse.text&&S.phase==='running')playSfx('message');lastTickerLine=pulse.text;if(S.phase==='reveal'&&lastPhase==='running')playSfx('week');lastPhase=S.phase;syncWorkAudio();$('cash').textContent=money(S.cash+l.net);$('headRevenue').textContent=money(S.chapterRevenue+l.revenue+(S.run&&!S.run.settled?S.run.eventRevenue:0));$('date').textContent=`${Game.date(S)} · 第 ${S.chapter+1} 關 · 第 ${Math.min(S.week+1,ch.weeks+(S.extended?4:0))} 週`;const shift=Game.workSchedule(S),clock=$('workClock');if(clock){const phrase=shift.action==='clockin'?'早安・打卡上班':shift.action==='clockout'?'打卡下班・明天見':shift.action==='working'?'工作中':S.phase==='reveal'?'本週已下班':'報到';const dayLabel=S.phase==='running'||S.phase==='event'?shift.weekday:S.phase==='reveal'?'週五':'下週一';clock.textContent=`${dayLabel} ${shift.time} · ${phrase}`;clock.classList.toggle('on',shift.action==='working'||shift.action==='clockin');clock.classList.toggle('off',!shift.active);}if($('tickerTag'))$('tickerTag').textContent=pulse.tag;if($('tickerText'))$('tickerText').textContent=pulse.text;
 if($('liveRevenue'))$('liveRevenue').textContent=money(l.revenue+(S.run?.eventRevenue||0));if($('liveOrders'))$('liveOrders').textContent=l.orders+' 筆';if($('timer')){const t=Math.ceil((Game.WEEK_MS-S.elapsed)/1000);$('timer').textContent=Math.floor(t/60)+':'+String(t%60).padStart(2,'0');$('weekProgress').style.width=l.portion*100+'%';}
 if($('phaseText'))$('phaseText').textContent=S.phase==='running'?(paused||modalType?'已暫停':`${shift.weekday} ${shift.time} · ${shift.action==='clockin'?'同事早安打卡':shift.action==='clockout'?'同事打卡下班': '團隊工作中'}`):S.phase==='event'?'等待老闆決策':S.phase==='reveal'?'本週已下班・週末回顧':`團隊士氣 ${Math.round(S.morale)} · 週一 10:00 上班`;syncScene();}
function tasksOf(id){const list=(S.phase==='planning'?S.plans:S.run?.results||[]).filter(a=>a.person===id).map(a=>Game.byId[a.card].name);return list.length?list.join('、'):'日常工作';}
function syncScene(){const f=$('office');if(!f)return;f.contentWindow?.postMessage({type:'tycoon-scene',paused:S.phase!=='running'||paused||!!modalType&&modalType!=='person'||document.hidden,busy:(S.run?.forecast.orders||0)>S.staff.length*26,orders:live().orders,people:S.staff.map(p=>({name:p.name,role:p.role,task:tasksOf(p.id),over:Game.load(S,p.id)>100})),count:S.staff.length,level:S.office,workday:Game.workSchedule(S),moods:Object.fromEntries(S.staff.map(p=>[p.name,Number.isFinite(p.morale)?p.morale:78]))},location.origin);}
const BUBBLE_ICON={inquiry:'💬',review:'⭐',idea:'💡'};
function postScene(msg){$('office')?.contentWindow?.postMessage(msg,location.origin);}
function clearBubbles(){for(const id of bubbles.keys())postScene({type:'tycoon-bubble-clear',id});bubbles.clear();}
function bubbleTick(now,dt,active){if(!active){for(const b of bubbles.values())b.expires+=dt;return;}
 for(const [id,b] of bubbles)if(now>b.expires){bubbles.delete(id);postScene({type:'tycoon-bubble-clear',id});}
 if(now<nextBubbleAt||bubbles.size>=3||!Game.workSchedule(S).active)return;nextBubbleAt=now+3200+Math.random()*3300;
 const pool=S.staff.flatMap(p=>Array(S.run?.results.some(r=>r.person===p.id)?3:1).fill(p)),p=pool[Math.floor(Math.random()*pool.length)];if(!p)return;
 const kind=Game.bubbleKind(S,p.id),id=++bubbleSeq;bubbles.set(id,{kind,person:p.id,expires:now+6500});postScene({type:'tycoon-bubble',id,name:p.name,icon:BUBBLE_ICON[kind],label:Game.HARVEST[kind]});}
function officeStage(){return [{name:'1F 起步辦公室',seats:3,next:'擴編一樓至 6 席'},{name:'1F 擴編工作室',seats:6,next:'增建 2F，擴至 12 席'},{name:'1F＋2F 公司總部',seats:12,next:'目前空間已達上限'}][S.office]||{name:'辦公室',seats:3,next:''};}
function nav(){const names={company:'公司',cards:'行動卡',team:'員工',chapters:'七個篇章',reports:'經營報告'};$('nav').innerHTML=Object.keys(names).map(k=>`<button data-tab="${k}" class="${tab===k?'active':''}" aria-current="${tab===k?'page':'false'}"><svg viewBox="0 0 24 24" aria-hidden="true">${icons[k]}</svg>${names[k]}</button>`).join('');}
function viewHead(kicker,title,extra=''){return `<div class="viewhead"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1></div><div class="topaction">${extra}</div></div>`;}
function slots(){return `<div class="slots">${[0,1,2].map(i=>{const a=S.plans[i];if(!a)return `<button class="slot empty" data-tab="cards" aria-label="選擇第 ${i+1} 項行動"><b>＋</b>行動 ${i+1}<span class="note">可以留空</span></button>`;const c=Game.byId[a.card],p=S.staff.find(x=>x.id===a.person);return `<button class="slot" data-detail="${a.card}">${art(c.art,c.name)}<span class="number">${i+1}</span><div class="slottext"><strong>${c.name}</strong>${p?.name||'待指派'}${a.ongoing?` · 剩 ${a.left} 週`:''}</div></button>`}).join('')}</div>`;}
function goal(){const c=Game.chapters[S.chapter],pct=S.chapterRevenue/c.target*100;return `<section class="goalpanel"><div class="eyebrow">CHAPTER ${String(S.chapter+1).padStart(2,'0')} · ${c.theme}</div><div class="goalvalue">${money(S.chapterRevenue)} <span style="font:13px sans-serif;color:#c7d3bf">/ ${money(c.target)}</span></div><div class="progress"><i style="width:${Math.min(100,pct)}%"></i></div><div class="progressdata"><span>${pct>=100?'已達標・繼續經營至期限':`達成 ${pct.toFixed(1)}%`}</span><span>剩 ${Math.max(0,c.weeks+(S.extended?4:0)-S.week)} 週${S.extended?'・延長期':''}</span></div><div class="team-morale"><span>團隊平均士氣</span><b>${Math.round(S.morale)} / 100</b><div class="progress"><i style="width:${Math.round(S.morale)}%;background:${S.morale<45?'linear-gradient(90deg,#d77f72,#f1b692)':'linear-gradient(90deg,#9e81d0,#f0a8b6,#efc46a)'}"></i></div></div>${pct>=100?`<p class="note" style="margin-top:8px">超標 ${money(S.chapterRevenue-c.target)}（${(pct-100).toFixed(1)}%）</p>`:''}</section>`;}
function notices(){return S.notices.slice(-3).map(n=>`<div class="notice"><strong>${esc(n.title)}</strong><br>${esc(n.text)}</div>`).join('');}
function company(){const c=Game.chapters[S.chapter],planning=S.phase==='planning',stage=officeStage();return viewHead('A FOUNDER’S STORY',c.name,`<button class="secondary" data-action="newsDesk">世界脈動</button><button class="secondary" data-action="help">玩法</button>`)+`<button class="worldticker" data-action="newsDesk" aria-label="開啟世界脈動與消息中心"><span class="livetag">LIVE</span><span class="tickertag" id="tickerTag">市場訊號</span><span class="tickertext" id="tickerText">彩寶市場正在變化…</span><span class="tickeropen">消息中心 ↗</span></button><div class="homegrid"><div><section class="officepanel"><iframe id="office" title="公司員工工作動畫" src="tzgro-card-office.html"></iframe><span class="officebadge">${stage.name} · ${S.staff.length}/${stage.seats} 人</span><span class="loading-note">點擊同事名牌・查看工作回報</span><div class="officecaption"><span class="statusdot" style="display:inline-block"></span> <span id="phaseText"></span> · ${planning?'週初安排完成後，第一批同事就在一樓開始營業。':'正在選品、回覆客人與包貨；點員工可巡視進度。'}</div></section><div class="minipeople">${S.staff.map(p=>`<button class="mini" data-person="${p.id}">${art(p.art,p.name)}${p.name}<small class="minitask">${esc(tasksOf(p.id))}</small><span class="${Game.load(S,p.id)>100?'bad':''}">${Game.load(S,p.id)>100?'超載':Game.load(S,p.id)>75?'忙碌':'充裕'} · 士氣 ${Math.round(p.morale??78)}</span></button>`).join('')}</div>${notices()}</div><div class="stack">${goal()}<section class="planpanel"><div class="row"><h3>${planning?'本週經營安排':'這一週正在發生'}</h3><span class="pill">${S.totalWeek%4}/4 週・月報</span></div>${slots()}${planning?`<p class="note">最多三項，不必選滿。開始後鎖定，日常業務持續進行。</p><div class="flexbuttons" style="margin-top:16px"><button class="secondary" data-tab="cards">選擇行動卡</button><button class="primary" data-action="confirmStart">開始本週 →</button></div>`:S.phase==='running'?`<div class="runbox"><div class="row"><div><div class="eyebrow">本週剩餘時間</div><b class="timer" id="timer">3:00</b></div><button class="secondary" data-action="pause">${paused?'繼續':'暫停'}</button></div><div class="progress"><i id="weekProgress"></i></div><div class="runstats"><div><small>營收・暫計</small><b id="liveRevenue"></b></div><div><small>累積訂單</small><b id="liveOrders"></b></div></div><button class="primary wide" data-action="skip">跳過至下一件事／本週結束 →</button><p class="note">每週三分鐘。跳過仍會停在需要你決定的事件。</p></div>`:`<button class="primary wide" data-action="resumePhase">${S.phase==='event'?'處理待決策事件':S.phase==='reveal'?'查看本週成果':'查看關卡結算'}</button>`}</section></div></div>`;}
function board(){const total=S.plans.reduce((n,p)=>n+(p.ongoing?0:Game.byId[p.card].cost)+(p.external&&!p.ongoing?40000:0),0);return viewHead('PLAN YOUR WEEK','三個選擇，一週的方向',`<button class="secondary" data-tab="company">回公司</button>`)+`<div class="boardtop"><section class="planpanel">${slots()}</section><section class="boardnote"><span class="pill">${S.phase==='planning'?'可以調整':'本週已鎖定'}</span><div class="row"><span>本週行動投入</span><b>${money(total)}</b></div><div class="row"><span>投入後現金</span><b class="${S.cash<total?'bad':''}">${money(S.cash-total)}</b></div><button class="primary wide" data-action="confirmStart" ${S.phase!=='planning'?'disabled':''}>確認安排・開始本週 →</button><p class="note" style="margin-top:10px">推薦人選可以改。超載會提醒，但最後由你決定。</p></section></div>${S.tutorial?`<div class="notice"><b>第一週帶玩 ${Math.min(S.plans.length+1,4)}/4</b><br>${S.plans.length===0?'先點一張卡，查看效果與推薦人選。':S.plans.length<3?'繼續比較不同的行動，觀察人員負荷。':'三項已安排。可點上方卡片換人，確認後開始本週。'}<br>例如：精選主打彩寶 → 粉專商品故事 → 熟客私訊。這是可嘗試的搭配，不保證成功。</div>`:''}<div class="categories" role="tablist" aria-label="卡牌分類">${['商品','行銷','人員','管理'].map(c=>`<button role="tab" aria-selected="${category===c}" data-category="${c}" class="${category===c?'active':''}">${c}</button>`).join('')}</div><div class="cardgrid">${Game.cards.filter(c=>c.cat===category&&Game.available(S,c)).map(c=>`<button class="actioncard ${S.plans.some(p=>p.card===c.id)?'selected':''}" data-detail="${c.id}">${art(c.art,c.name)}<span class="ribbon">${c.id==='opportunity'?'限時機會・本週':c.duration>1?'跨週企劃':'經營行動'}</span><div class="cardcontent"><div class="eyebrow">${c.cat} / ${Game.skills[c.skill]}</div><h3>${c.name}</h3><p class="description">${c.desc}</p><div class="row"><b>${c.cost?money(c.cost):'免費行動'}</b><span>${c.duration} 週 · 工時 ${c.load}</span></div></div></button>`).join('')}</div>`;}
function skillRows(p){return `<div class="skillrows">${Object.entries(Game.skills).map(([k,n])=>`<div class="skillrow"><span>${n}</span><div class="progress"><i style="width:${p.skills[k]}%"></i></div><b>${Math.round(p.skills[k])}</b></div>`).join('')}</div>`;}
function trust(p){const issues=p.records.filter(r=>r.issue).length;return p.records.length<3?'尚待觀察':issues>2?'近期回報有不一致之處':'過往回報大致可靠';}
function team(){return viewHead('PEOPLE MAKE THE BUSINESS','一起經營，也要懂得判斷',`<button class="secondary" data-action="expand">擴張空間</button>`)+`<p class="note" style="margin-bottom:18px">${S.staff.length}/${[3,6,12][S.office]} 個座位${S.office===2?'（1F＋2F）':''} · HR 第五關開放。能力可比較，誠信與動機需要從行為了解。</p><div class="personGrid">${S.staff.map(p=>`<article class="personcard">${art(p.art,p.name)}<div class="personbody"><div class="row"><h3>${p.name}</h3><span class="pill ${p.adapt?'':'green'}">${p.adapt?'適應期':'在職'}</span></div><p class="note">${p.role}</p><div class="moraleline"><span>士氣 ${Math.round(p.morale??78)} / 100</span><div class="progress"><i style="width:${Math.round(p.morale??78)}%;background:${(p.morale??78)<45?'linear-gradient(90deg,#bc665a,#e3a085)':'linear-gradient(90deg,#8e73c4,#e8a5b1,#e7bd67)'}"></i></div></div>${skillRows(p)}<div class="row note"><span>精力 ${Math.round(p.energy)}</span><span class="${Game.load(S,p.id)>100?'bad':''}">負荷 ${Math.round(Game.load(S,p.id))}</span></div><p class="note" style="margin:10px 0">${trust(p)}${p.pip?` · 改善剩 ${p.pip.left} 週`:''}</p><button class="secondary wide" data-person="${p.id}">查看人員資料</button>${p.exitReady?`<button class="secondary danger wide" data-dismiss="${p.id}" style="margin-top:8px">確認離職與交接</button>`:''}</div></article>`).join('')}</div>${S.arrivals.length?`<div class="notice">下週到職：${S.arrivals.map(p=>p.name).join('、')}</div>`:''}`;}
function chaptersView(){return viewHead('SEVEN CHAPTERS','你的公司，穿越不同時代')+`<p class="note" style="margin-bottom:20px">第二至六關可以自由轉型。每關營業額重新計算，現金、員工與能力延續。公司階段年份為遊戲編排；未宣稱等同實際公司史。</p><div class="routegrid">${Game.chapters.map((c,i)=>`<article class="chaptercard ${S.chapter===i?'current':i>S.chapter?'locked':''}">${art(c.art,c.theme)}<div class="body"><div class="row"><span class="big">0${i+1}</span><span class="pill">${i<S.chapter?'已完成':i===S.chapter?'目前篇章':'尚未進入'}</span></div><h3 style="margin:8px 0">${c.theme}</h3><p class="note">${c.intro}</p><p class="note" style="margin-top:10px">${c.weeks} 週 · 目標 ${money(c.target)}</p></div></article>`).join('')}</div>${S.chapter===6?`<div class="panelbox" style="margin-top:24px"><h3>收購與上市進度</h3>${['diligence','acquire','integrate','governance','listing'].map(k=>`<div class="row" style="padding:10px 0"><span>${Game.byId[k].name}</span><b>${S.capabilities[k]?'已完成':'待完成'}</b></div>`).join('')}<p class="note">遊戲上市條件：完成整合與治理、關卡獲利為正、現金至少 100 萬、士氣至少 45。這不是實際法規門檻。</p><div class="row"><span>Regina 持股 ${S.equity}%</span><span>借款 ${money(S.debt)}</span></div><div class="flexbuttons" style="margin-top:12px"><button class="secondary" data-finance="loan">借款 100 萬</button><button class="secondary" data-finance="equity">引資 200 萬／10% 股權</button></div></div>`:''}`;}
function reports(){return viewHead('LOOK BACK · LEARN FORWARD','經營報告')+`<div class="summary"><div><small>本關營業額</small><strong>${money(S.chapterRevenue)}</strong></div><div><small>本關獲利</small><strong>${money(S.chapterProfit)}</strong></div><div><small>團隊士氣</small><strong>${Math.round(S.morale)} / 100</strong></div></div><div class="reportgrid"><section class="panelbox"><h3>四週管理月報</h3>${S.reports.length?`<table class="ledger"><thead><tr><th>結算至</th><th>營收</th><th>結餘</th></tr></thead><tbody>${S.reports.slice(0,12).map(r=>`<tr><td>${r.to}</td><td>${money(r.revenue)}</td><td>${money(r.net)}</td></tr>`).join('')}</tbody></table>`:'<p class="empty">完成四週後，第一份月報會送達。</p>'}</section><section class="panelbox"><h3>最近的經營紀錄</h3>${S.log.slice(0,10).map(l=>`<div class="hrrecord"><span class="note">${l.date}</span><br>${esc(l.text)}</div>`).join('')||'<p class="empty">下一個決定，由你開始。</p>'}</section></div><div class="panelbox" style="margin-top:20px"><h3>時代記事</h3>${Game.histories.filter(h=>h.date<=Game.date(S)).sort((a,b)=>a.date.localeCompare(b.date)).map(h=>`<div class="hrrecord"><b>${h.date} · ${esc(h.title)}</b><p>${esc(h.body)}</p><a href="${h.url}" target="_blank" rel="noopener">歷史資料來源 ↗</a></div>`).join('')||'<p class="note">2019 年，先從 FB 粉專開始。</p>'}<h3 style="margin-top:20px">每週回顧</h3>${S.history.slice(0,12).map((h,i)=>`<button class="secondary wide" style="margin-top:8px" data-week-report="${i}">${h.date} · 營收 ${money(h.revenue)} · 查看成果</button>`).join('')}<div class="tabtoolbar"><button class="secondary" data-action="export">匯出存檔</button><button class="secondary" data-action="import">載入存檔</button><button class="secondary" data-action="restart">重新開局</button><button class="secondary" data-action="help">玩法與設定</button></div><p class="note" style="margin-top:14px">數值為決策訓練模型，非營收預測。未串接真實帳戶或 AI API。卡牌與人物圖片為 AI 生成的虛構美術。</p></div>`;}
function render(){nav();$('app').innerHTML=({company,cards:board,team,chapters:chaptersView,reports}[tab])();paint();}
function show(title,html,type='info',closeable=true,kicker='TZGRO · 老闆的決定'){if($('overlay').hidden)focusBefore=document.activeElement;modalType=type;$('dialogTitle').textContent=title;$('dialogKicker').textContent=kicker;$('dialogBody').innerHTML=html;$('closeDialog').hidden=!closeable;$('overlay').hidden=false;syncScene();setTimeout(()=>($('dialogBody').querySelector('button,select')||$('closeDialog')).focus(),10);}
function hide(){if(['event','reveal','ending'].includes(modalType))return;$('overlay').hidden=true;modalType='';detail=null;syncScene();focusBefore?.focus?.();}
function forceHide(){$('overlay').hidden=true;modalType='';detail=null;}
function personOptions(value){return S.staff.map(p=>`<option value="${p.id}" ${p.id===value?'selected':''}>${p.name} · ${p.role}</option>`).join('');}
function openCard(id){const c=Game.byId[id];if(!c)return;const plan=S.plans.find(p=>p.card===id);detail={...plan,card:id,person:plan?.person||Game.recommend(S,c),target:plan?.target||S.staff.find(p=>p.id!=='regina')?.id||'regina',skill:plan?.skill||c.skill,role:plan?.role||'行銷客服',external:plan?.external||false};cardDialog();}
function cardDialog(){const a=detail,c=Game.byId[a.card],existing=S.plans.some(p=>p.card===c.id),locked=S.phase!=='planning'||a.ongoing;const member=S.staff.find(p=>p.id===a.person);const projected=S.plans.filter(p=>p.card!==a.card).concat([a]),workload=Game.load(S,a.person,projected);show(c.name,`<div class="detailgrid"><div>${art(c.art,c.name,'detailart')}<div class="summary" style="grid-template-columns:1fr 1fr"><div><small>固定投入</small><strong>${money(a.ongoing?0:c.cost)}</strong></div><div><small>執行時間</small><strong>${a.left||c.duration} 週</strong></div></div></div><div><span class="pill">${c.cat} · ${Game.skills[c.skill]}</span><p>${c.desc}</p><p class="note">需要 ${c.load} 工作量；${c.duration>1?'期間持續占一格，週末可以止損。':'完成後釋放本週名額。'}</p><label>負責人 · 系統推薦 ${S.staff.find(p=>p.id===Game.recommend(S,c))?.name}</label><div class="compare">${S.staff.map(p=>`<button data-assign="${p.id}" ${locked?'disabled':''} class="${a.person===p.id?'chosen':''}">${art(p.art,p.name)}${p.name}<br>${Game.skills[c.skill]} ${Math.round(p.skills[c.skill])}</button>`).join('')}</div><div class="notice ${workload>100?'bad':''}">${member.name} 分配後負荷 ${Math.round(workload)} · ${workload>100?'超載，品質與精力會受影響':workload>75?'忙碌，請注意日常工作':'尚有餘裕'}</div>${['train','assess','pip'].includes(c.id)?`<label>接受${c.id==='train'?'培訓':c.id==='assess'?'考核':'改善'}的員工</label><select data-field="target" ${locked?'disabled':''}>${personOptions(a.target)}</select>${c.id!=='pip'?`<label>能力項目</label><select data-field="skill" ${locked?'disabled':''}>${Object.entries(Game.skills).map(([k,v])=>`<option value="${k}" ${a.skill===k?'selected':''}>${v}</option>`).join('')}</select>`:''}`:''}${c.id==='assess'?`<label><input type="checkbox" data-external ${a.external?'checked':''} ${locked?'disabled':''}> 委託外部顧問（加 4 萬）</label>`:''}${c.id==='hire'?`<label>招募職務</label><select data-field="role" ${locked?'disabled':''}>${['行銷客服','包裝出貨','營運特助',...(S.chapter>=4?['HR']:[])].map(v=>`<option ${a.role===v?'selected':''}>${v}</option>`).join('')}</select><p class="note">提供三位，不合適可全數放棄，下週重新安排。錄用後下週到職。</p>`:''}<div class="flexbuttons" style="margin-top:18px">${!locked?`<button class="primary" data-action="saveCard">${existing?'更新分配':'加入本週'}</button>`:''}${existing&&S.phase==='planning'?`<button class="secondary danger" data-remove="${a.card}">${a.ongoing?'停止企劃・投入不退':'移除行動'}</button>`:''}${S.phase!=='planning'?'<p class="note">本週安排已鎖定，下週再調整。</p>':''}</div></div></div>`,'card',true,'ACTION CARD · '+(existing?'本週安排':'選擇你的行動'));}
function confirmStart(){if(S.phase!=='planning'){toast('目前不是規劃階段');return;}const fees=S.plans.reduce((n,p)=>n+(p.ongoing?0:Game.byId[p.card].cost)+(p.external&&!p.ongoing?40000:0),0);show('準備開始這一週',`${slots()}<div class="notice">${S.plans.length?'開始後，行動與負責人會鎖定。':'本週不安排額外行動，員工繼續日常業務。'}完整執行三分鐘，可跳過，但重要事件仍需你決定。</div><div class="row"><span>本週行動費用</span><b>${money(fees)}</b></div>${S.staff.filter(p=>Game.load(S,p.id)>100).map(p=>`<p class="bad note">${p.name} 超載：你仍可以開始，但會影響品質與精力。</p>`).join('')}<button class="primary wide" style="margin-top:20px" data-action="start" ${fees>S.cash?'disabled':''}>確認・開始本週 →</button>`,'confirm');}
function eventDialog(){const e=Game.currentEvent(S);if(!e)return;const isNews=e.type==='news',p=!isNews?S.staff.find(p=>p.id===e.speaker)||S.staff[0]:null;const body=isNews?`<div class="eventhero newshero">${art(e.art,e.title)}<div class="newsbadge">${esc(e.scope)}新聞 · ${esc(e.newsDate)}</div></div><div class="factbox"><div class="eyebrow">已核實的新聞事件</div><p>${esc(e.statement)}</p><a href="${esc(e.source)}" target="_blank" rel="noopener">查看原始來源 ↗</a></div><div class="notice"><b>遊戲推演，不是史實結論</b><br>${esc(e.facts[0])}</div><p class="note">選擇一項應對後，市場效果會延續數週並影響後續營收。這些數值是可玩的情境模型。</p><div class="eventchoices">${e.choices.map(([id,label,cost])=>`<button data-choice="${id}" ${S.cash<cost?'disabled':''}><span>${esc(label)}<small class="choicehint">適用 ${Game.newsEvents.find(n=>n.id===e.storyId)?.duration||0} 週市場波動</small></span><b>${cost?money(cost):'不追加預算'}</b></button>`).join('')}</div>`:`<div class="eventhero">${art(e.art,e.title)}<div class="speaker">${art(p.art,p.name)}<div><b>${p.name}</b><br>${p.role} · ${trust(p)}</div></div></div><div class="quote">「${esc(e.statement)}」</div><p class="note">這是員工的說法。你可以先追問、看現有文件，或付費委託查核。</p><div class="eventcols"><section><h3>追問員工 · 免費</h3>${e.questions.map((q,i)=>`<button class="secondary wide" style="margin-top:8px" data-ask="${i}">${e.asked.includes(i)?'已追問 · ':''}${q}</button>`).join('')}${e.answer?`<div class="notice">${esc(e.answer)}</div>`:''}</section><section><h3>查看證據 · 免費</h3>${e.facts.map((f,i)=>e.evidence.includes(i)?`<div class="evidence">${esc(f)}</div>`:`<button class="secondary wide" style="margin-top:8px" data-evidence="${i}">${i?'查看過往／工作紀錄':'打開本次文件'}</button>`).join('')}</section></div><div class="eventchoices">${e.choices.map(([id,label,cost])=>`<button data-choice="${id}" ${S.cash<cost?'disabled':''}><span>${label}</span><b>${cost?money(cost):'不追加預算'}</b></button>`).join('')}<button data-choice="investigate" ${S.cash<30000?'disabled':''}><span>暫緩機會，委託獨立查核<br><small>下週收到報告，這次機會可能錯過</small></span><b>NT$3萬</b></button></div>`;show(e.title,body,'event',false,isNews?'WORLD EVENT · 決策後影響延續':'EVENT · 時間已暫停');playSfx(isNews?'news':'event');}
function newsDesk(){const w=Game.worldStatus(S),p=Game.ticker(S),pct=x=>`${Math.round(x*100)}%`;const signals=[['線上需求',w.online],['線下需求',w.offline],['廣告效率',w.ads],['短影音觸及',w.video],['直播觸及',w.live],['熟客回購',w.retention],['物流成本',w.shipping]];const current=S.run?.ticker||[p];show('世界脈動｜新聞與市場',`<p class="note">真實新聞提供事件背景；公司受到的影響與選項結果，均為遊戲情境推演。模擬市場訊號與客人留言是虛構內容，並非即時抓取網路資訊。</p><div class="tickerpreview"><span class="livetag">${p.simulated?'SIM':'LIVE'}</span><b>${esc(p.tag)}</b><span>${esc(p.text)}</span></div><h3>目前市場狀態</h3><div class="signalgrid">${signals.map(([n,v])=>`<div><span>${n}</span><b class="${v<.92?'bad':v>1.08?'good':''}">${pct(v)}</b><small>${v<.98?'承壓':v>1.02?'高於基準':'接近基準'}</small></div>`).join('')}</div><h3 style="margin-top:22px">持續中的影響</h3>${w.active.length?w.active.map(x=>`<div class="notice"><b>${esc(x.label)}</b><br>還有 ${x.left} 週</div>`).join(''):'<p class="empty">目前沒有跨週市場衝擊。</p>'}<h3 style="margin-top:22px">本週跑馬燈</h3>${current.map(x=>`<div class="hrrecord"><span class="pill ${x.news?'':'green'}">${esc(x.tag)}</span><p style="margin-top:7px">${esc(x.text)}</p></div>`).join('')}<h3 style="margin-top:22px">已處理的新聞決策</h3>${(S.newsLog||[]).slice(0,8).map(n=>`<article class="newsrecord"><span class="pill">${esc(n.scope)} · ${n.date}</span><b>${esc(n.title)}</b><p>你的決策：${esc(n.choice)}</p><p class="note">${esc(n.game)}</p><a href="${esc(n.source)}" target="_blank" rel="noopener">原始新聞來源 ↗</a></article>`).join('')||'<p class="empty">重大歷史事件會按遊戲年份出現。</p>'}`,'newsdesk',true,'WORLD PULSE · 史實與推演分開');}
const signed=n=>(n>=0?'+':'−')+money(Math.abs(n)),pts=n=>(n>=0?'+':'−')+Math.abs(n).toFixed(1);
function causes(h){const rows=[];for(const a of h.results||[])if(a.contribution)rows.push(`<li><b>${esc(a.title||Game.byId[a.card].name)}</b>｜${esc(a.personName)} 負責 → 約 <b class="good">${signed(a.contribution)}</b> 營收</li>`);
 if(h.sources){rows.push(`<li><b>日常業務</b>｜客服、出貨、熟客回購與已建立的能力 → 約 ${signed(h.sources.daily)}</li>`);if(h.sources.synergy>1)rows.push(`<li><b>卡牌搭配</b>｜選品＋內容／熟客互相配合 → 約 ${signed(h.sources.synergy)}</li>`);}
 for(const e of h.events||[]){if(e.choice===undefined)continue;const fx=[e.revenue?`營收 ${signed(e.revenue)}`:'',e.cash?`現金 ${signed(e.cash)}`:'',Math.abs(e.brand)>=.05?`口碑 ${pts(e.brand)}`:'',Math.abs(e.morale)>=.05?`士氣 ${pts(e.morale)}`:''].filter(Boolean);rows.push(`<li><b>${esc(e.title)}</b>｜${e.news?'新聞應對':esc(e.who||'老闆')+' 回報'}｜你選「${esc(e.choice)}」→ ${fx.length?fx.join('、'):'數字沒有立即變化'}</li>`);}
 const hv=h.harvest;if(hv&&hv.inquiry+hv.review+hv.idea)rows.push(`<li><b>你點收的泡泡</b>｜詢問 ${hv.inquiry}・好評 ${hv.review}・靈感 ${hv.idea} → ${[hv.revenue?`營收 ${signed(hv.revenue)}`:'',hv.brand?`口碑 ${pts(hv.brand)}`:'',hv.idea?'員工能力提升':''].filter(Boolean).join('、')}</li>`);
 return rows.length?`<section class="causes"><h3>本週為什麼是這個數字</h3><ul>${rows.join('')}</ul><p class="note">「約」是依本週各項效果比例拆分；事件與泡泡是實際入帳的變化。</p></section>`:'';}
function reportSummary(h){const shifts=(h.attendance||[]).filter(a=>a.clockIn&&a.clockOut).length;return `<div class="summary"><div><small>本週營收</small><strong>${money(h.revenue)}</strong></div><div><small>本週結餘</small><strong>${money(h.net)}</strong></div><div><small>公司現金</small><strong>${money(h.cash)}</strong></div></div>${causes(h)}<table class="ledger"><tbody><tr><td>商品與事件履約成本</td><td>${money(h.goods)}</td></tr><tr><td>營運、人事與場地</td><td>${money(h.overhead)}</td></tr><tr><td>基礎行銷支出</td><td>${money(h.marketing)}</td></tr><tr><td>行動與事件支出</td><td>${money(h.extra)}</td></tr></tbody></table><div class="notice"><b>上下班與團隊狀態</b><br>週一至週五打卡：${shifts}/5 天 · 週末士氣 ${Math.round(h.morale??78)}/100${h.staffMorale?.length?'<br>'+h.staffMorale.map(p=>`${esc(p.name)} ${Math.round(p.morale)}`).join('　·　'):''}</div>${h.events.map(e=>`<div class="notice"><b>${e.title}</b><br>${e.result}<br><small>建議：${e.advice}</small></div>`).join('')}`;}
function revealDialog(){const r=S.run;if(!r)return;const n=r.results.length;show('本週的選擇，留下了什麼',`<p class="note">先看行動成果，再一起看整週營收。卡牌搭配效果不重複計算。</p><div class="revealgrid">${r.results.map((a,i)=>i<S.revealIndex?`<article class="revealed">${art(Game.byId[a.card].art,a.title)}<div class="body"><span class="pill">${a.left>0?'執行中':a.completed?'完成':'需改善'}</span><h3 style="margin-top:8px">${a.title}</h3><p>${a.message}</p>${a.contribution?`<p class="contrib">${esc(a.personName)} 負責・帶來約 <b>${money(a.contribution)}</b> 營收</p>`:''}<p class="note" style="margin-top:10px">建議：${a.advice}</p></div></article>`:`<button class="cardback" data-action="reveal"><b>◇</b>行動 ${i+1} · 點擊揭曉</button>`).join('')}</div>${S.revealIndex<n?`<div class="flexbuttons"><button class="primary" data-action="reveal">揭曉下一張</button><button class="secondary" data-action="revealAll">一鍵看完</button></div>`:`${r.synergy?'<div class="notice">選品與內容／熟客聯繫相互配合，形成了本週的搭配效果。</div>':''}${reportSummary(r.report)}${r.monthReady?`<div class="notice"><b>四週管理月報已送達</b><br>本期營收 ${money(S.reports[0].revenue)} · 結餘 ${money(S.reports[0].net)}。可到經營報告查看。</div>`:''}${S.candidates.length?`<button class="secondary wide" style="margin-top:16px" data-action="candidates">查看三位候選人 →</button>`:''}<button class="primary wide" style="margin-top:16px" data-action="nextWeek">${S.week>=Game.chapters[S.chapter].weeks+(S.extended?4:0)?'查看關卡結算':'完成回顧・安排下一週'} →</button>${S.candidates.length?'<p class="note">直接繼續代表本次不錄用；下週可再次安排招募。</p>':''}`}`,'reveal',false,'WEEKLY REVEAL · '+Game.date(S));}
function candidatesDialog(){show('三位候選人，由你決定',`<div class="personGrid">${S.candidates.map(p=>`<article class="personcard">${art(p.art,p.name)}<div class="personbody"><h3>${p.name}</h3><p class="note">${p.role} · 薪資 ${money(p.salary)}/月</p>${skillRows(p)}<p class="note">誠信尚待觀察。下週到職，第一週效率較低。</p><button class="primary wide" data-hire="${p.id}">錄用 ${p.name}</button></div></article>`).join('')}</div><p class="note" style="margin:15px 0">座位 ${S.staff.length+S.arrivals.length}/${[3,6,12][S.office]}。全數不錄用，下週可再安排招募。</p><div class="flexbuttons"><button class="secondary" data-action="expand">擴張辦公室</button><button class="secondary" data-action="rejectCandidates">本次全部不錄用</button></div>`,'candidates',true,'RECRUITMENT · 能力可見，動機仍待了解');}
function endingDialog(){const c=Game.chapters[S.chapter],score=Game.rating(S),won=S.phase==='chapterWon'||S.phase==='complete';if(S.phase==='extension'){show('還有一次調整的機會',`${art(c.art,c.name,'detailart')}<p style="margin:16px 0">原定 ${c.weeks} 週已結束。目前營業額 ${money(S.chapterRevenue)}，目標 ${money(c.target)}。${S.chapter===6&&!S.capabilities.listing?'上市準備也尚未完成。':''}</p><div class="notice">可延長一次，固定四週。進度保留、目標不變，評價扣 12 分。</div><div class="flexbuttons"><button class="primary" data-action="extend">延長四週，繼續經營</button><button class="secondary" data-action="retry">重試本關</button></div>`,'ending',false,'CHAPTER REVIEW');return;}
 show(won?(S.chapter===6?'從創辦人，到上市企業':'這一章，你做到了'):'這次經營，需要重新選擇',`<div class="detailgrid"><div>${art(c.art,c.theme,'detailart')}</div><div><div class="eyebrow">CHAPTER ${S.chapter+1} / ${c.theme}</div><div class="rank">${won?score.rank:'RETRY'}</div><h3>${won?'經營評價 '+score.score+' 分':S.failure||'未達本關條件'}</h3><div class="summary" style="grid-template-columns:1fr 1fr"><div><small>目標達成率</small><strong>${(S.chapterRevenue/c.target*100).toFixed(1)}%</strong></div><div><small>${score.over>=0?'超標金額':'距離目標'}</small><strong>${money(Math.abs(score.over))}</strong></div></div><p>超標比例：${Math.max(0,score.over/c.target*100).toFixed(1)}%<br>本關獲利：${money(S.chapterProfit)}<br>團隊士氣：${Math.round(S.morale)}<br>延期紀錄：${S.extended?'已使用・評價扣分':'未使用'}</p><p class="note">${score.margin<.2?'建議：營業額之外，也要檢查費用、履約與獲利。':'保留有效的商品、內容與團隊搭配，避免盲目擴張。'}</p>${won?`<button class="primary wide" data-action="nextChapter">${S.chapter===6?'完成七章・保存這段歷程':'帶著公司，前往下一關'} →</button>`:`<button class="primary wide" data-action="retry">回到本關起點重試</button>`}<button class="secondary wide" style="margin-top:10px" data-action="export">匯出存檔</button></div></div>`,'ending',false,'YOUR CHOICES · YOUR COMPANY');}
function personDialog(id,question='status',sceneActivity=''){const p=S.staff.find(x=>x.id===id);if(!p)return;const report=Game.employeeStatus(S,id,question);show(p.name+'｜現場工作回報',`<div class="detailgrid"><div>${art(p.art,p.name,'detailart')}</div><div><span class="pill">${p.role}</span><div class="workreport"><div class="eyebrow">BOSS WALKTHROUGH · ${report.weekday} ${report.time}</div><b>目前工作</b>${sceneActivity?`<p class="sceneactivity">現場動作：${esc(sceneActivity)}</p>`:''}<p>${esc(report.task)}</p>${report.progress?`<small class="muted">${esc(report.progress)}</small>`:''}<blockquote class="staffreply"><span>${esc(p.name)} 回報</span>${esc(report.reply)}</blockquote><div class="chatprompts"><button class="secondary" data-chat-query="progress" data-person="${p.id}">工作進度？</button><button class="secondary" data-chat-query="blocker" data-person="${p.id}">有遇到卡關嗎？</button><button class="secondary" data-chat-query="morale" data-person="${p.id}">最近狀態如何？</button></div></div>${skillRows(p)}<p>士氣 ${report.morale}/100 · 精力 ${Math.round(p.energy)} · 工作負荷 ${report.load}<br>月薪 ${p.id.startsWith('founder')||p.id==='regina'?'已含基準營運費':money(p.salary)}</p><div class="notice">${trust(p)}<br><small>員工回報是模擬對話；紀錄可能不完整，仍由你判斷。</small></div>${p.pip?`<p>改善計畫剩 ${p.pip.left} 週，期間維持原工作。</p>`:''}<p class="note">${S.chapter<4?'第五關前由 Regina 或外部顧問核對紀錄。':'可委託已聘用的 HR 整理紀錄；她的評估也需要判斷。'}</p><button class="secondary wide" data-review-person="${p.id}">委託整理工作紀錄</button>${p.exitReady?`<button class="secondary danger wide" data-dismiss="${p.id}" style="margin-top:10px">確認離職・遊戲程序已完成</button>`:''}</div></div>`,'person');}
function reviewPerson(id){const p=S.staff.find(x=>x.id===id),hr=S.staff.find(p=>p.role==='HR'),owner=hr||S.staff[0];const records=p.records.slice(-5);const visible=owner.hidden.bias>.65?records.filter((r,i)=>i%2===0):records;show('工作紀錄整理',`<div class="notice"><b>整理人：${owner.name}</b><br>這份摘要可能有遺漏，請區分紀錄與判斷。</div><h3>整理出的資料</h3>${visible.map(r=>`<div class="evidence">第 ${r.week+1} 週：${esc(r.text)}</div>`).join('')||'<p class="empty">目前資料不足，尚不能下結論。</p>'}<h3>整理人的判斷</h3><p style="margin:12px 0">${visible.filter(r=>r.issue).length>1?'近期有多項需要釐清的紀錄，建議先追問原因。':'目前整理到的資料沒有足夠依據判斷有意隱瞞，仍需觀察。'}</p><button class="secondary wide" data-person="${id}">回人員資料</button>`,'review');}
function welcome(){show('從三個人，開始你的珠寶人生',`<div class="tutorial">${art('regina','Regina 在珠寶工作室')}<div><div class="eyebrow">CHAPTER 01 · 2019</div><h1>好的生意，<br>從一次判斷開始。</h1><p>你是 Regina。與兩位創始夥伴，以 500 萬現金經營彩色寶石。</p><ol><li>每週最多選三張不同的行動卡。</li><li>比較能力與負荷，指派負責人。</li><li>三分鐘自主執行，遇到事件由你決定。</li><li>週末揭曉成果，四週檢視月報。</li></ol><p class="note">第一關：12 週累積營業額 600 萬。這些是首版可調整的遊戲目標。員工說法可能不完整，你可以追問與查證。</p><button class="primary wide" style="margin-top:18px" data-action="tutorial">帶我安排第一週 →</button></div></div>`,'welcome',false,'TZGRO · 七章經營卡牌');}
function help(){show('玩法與遊戲設定',`<div class="stack"><h3>每週三項，開始後鎖定</h3><p>固定卡牌加上限時機會。可以留空；日常客服與出貨自動進行。跨週企劃持續占格，週初可停止，投入不退。</p><h3>每週三分鐘，重要事件不能跳過</h3><p>每週一至三件事件，先聽員工說明，再追問、看證據或付費查核。重大新聞會按遊戲年份出現並暫停等你決策；應對會影響接下來數週的市場需求、投放或履約成本。主畫面跑馬燈輪播客人留言、模擬市場訊號與新聞。</p><p class="note">官方新聞只作背景事實；市場影響是遊戲推演。留言與市場訊號為虛構內容，遊戲不連接即時新聞串流。</p><h3>七關與延期</h3><p>依本關累積營業額判定過關，提早達標也要完成期限。未達標可延長四週一次。第七關另需完成收購、整合與上市準備。</p><h3>上下班與士氣</h3><p>每週三分鐘代表五個工作日，週一至週五每天 10:00 打卡、19:00 下班；同事會走進辦公室，說早安，收工時告別離開。重要事件暫停當下的工作時鐘。個人負荷過高會降低士氣，穩定工作與恢復會慢慢回升；士氣會影響能力效率。人員頁可查看每位同事的士氣，週報會保留五天打卡摘要。</p><h3>人員不是只有數字</h3><p>能力可見，學習意願與誠信隱藏。培訓不保證有效，可安排實作考核；四週改善失敗後，由老闆確認離職。</p><h3>音樂與音效</h3><p>Fashion Lounge House · Music_For_Videos。輕盈 lounge house groove，可獨立開關。音效也可獨立開關：員工工作時有低音量鍵盤／包裝聲，訊息提示、事件決策與週結算各有短音效。第一次按下音效開關才啟用；預設靜音。<br><a href="https://pixabay.com/music/soft-house-fashion-lounge-house-145031/" target="_blank" rel="noopener">曲目與創作者 ↗</a> · <a href="https://pixabay.com/service/license-summary/" target="_blank" rel="noopener">Pixabay 授權摘要 ↗</a></p><h3>資料與美術</h3><p>本版使用本機存檔，不串接真實營運帳戶或 AI API。員工對話來自同一事件的固定資料。圖片為 AI 生成的虛構遊戲美術，不是實際員工照片。</p><p class="note">遊戲費用、評價、關卡年份與上市條件是訓練模型設定，不是法規或真實公司紀錄。公司現金在週內含暫計，結算時正式入帳。</p></div>`,'help');}
function resumePhase(){if(S.phase==='event')eventDialog();else if(S.phase==='reveal')revealDialog();else if(['chapterWon','extension','failed','complete'].includes(S.phase))endingDialog();}
$('closeDialog').onclick=()=>{const previous=modalType;hide();if(previous==='candidates')revealDialog();};
$('musicToggle').onclick=()=>{musicOn=!musicOn;syncMusic();};$('sfxToggle').onclick=()=>{soundOn=!soundOn;try{localStorage.setItem(SFX_KEY,String(soundOn));}catch{}if(soundOn)ensureAudio();syncSoundUI();syncWorkAudio();if(soundOn)playSfx('start');};
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;const d=b.dataset;if(d.tab){tab=d.tab;render();window.scrollTo({top:0});return;}if(d.category){category=d.category;render();return;}if(d.detail){openCard(d.detail);return;}if(d.assign){detail.person=d.assign;cardDialog();return;}if(d.remove){act(()=>Game.cancel(S,d.remove));forceHide();return;}if(d.ask!==undefined){Game.ask(S,+d.ask);save();eventDialog();return;}if(d.evidence!==undefined){Game.evidence(S,+d.evidence);save();eventDialog();return;}if(d.choice){const err=Game.resolve(S,d.choice);if(err){toast(err);return;}playSfx('decision');forceHide();save();render();resumePhase();return;}if(d.chatQuery&&d.person){personDialog(d.person,d.chatQuery);return;}if(d.person){personDialog(d.person);return;}if(d.reviewPerson){reviewPerson(d.reviewPerson);return;}if(d.dismiss){show('確認離職與工作交接',`<p>本版視為已完成必要程序。結算一個月薪資作為遊戲離職費用，工作自動分攤，其他同事負荷可能增加。</p><button class="primary wide" style="margin-top:18px" data-confirm-dismiss="${d.dismiss}">確認執行</button>`,'dismiss');return;}if(d.confirmDismiss){if(act(()=>Game.dismiss(S,d.confirmDismiss)))forceHide();return;}if(d.hire){if(act(()=>Game.hire(S,d.hire))){forceHide();revealDialog();}return;}if(d.finance){act(()=>Game.finance(S,d.finance));return;}if(d.weekReport!==undefined){show('每週回顧',reportSummary(S.history[+d.weekReport]),'report');return;}
 switch(d.action){case 'tutorial':forceHide();tab='cards';render();break;case 'help':help();break;case 'newsDesk':newsDesk();break;case 'confirmStart':confirmStart();break;case 'start':{const err=Game.start(S);if(err){toast(err);break;}playSfx('start');forceHide();paused=false;lastFrame=performance.now();nextBubbleAt=lastFrame+2500;tab='company';save();render();break;}case 'saveCard':{const a=detail,existing=S.plans.find(p=>p.card===a.card);if(existing){Object.assign(existing,a);}else{const err=Game.plan(S,a.card);if(err){toast(err);break;}Object.assign(S.plans.at(-1),a);}forceHide();save();render();break;}case 'pause':paused=!paused;lastFrame=performance.now();render();break;case 'skip':if(S.phase==='running'){Game.advanceTime(S,Game.WEEK_MS);save();render();resumePhase();}break;case 'resumePhase':resumePhase();break;case 'reveal':S.revealIndex++;save();revealDialog();break;case 'revealAll':S.revealIndex=S.run.results.length;save();revealDialog();break;case 'nextWeek':forceHide();Game.nextWeek(S);save();render();resumePhase();break;case 'candidates':candidatesDialog();break;case 'rejectCandidates':S.candidates=[];save();revealDialog();break;case 'extend':forceHide();Game.extend(S);save();render();break;case 'retry':forceHide();S=Game.retry(S);save();tab='company';render();break;case 'nextChapter':if(S.phase==='complete'){forceHide();tab='reports';render();break;}forceHide();Game.nextChapter(S);save();render();if(S.phase==='complete')endingDialog();break;case 'expand':{if(S.office>=2){toast('已達最大空間');break;}show('擴張辦公室',`<p><b>${S.office===0?'目前是一樓起步辦公室，3 個座位。':'目前是一樓擴編工作室，6 個座位。'}</b></p><p>下一階段：${S.office===0?'擴編一樓至 6 席':'增建二樓工作區，擴至 12 席'}。一次性搬遷與整備費 ${money([600000,1200000][S.office])}；每月額外場地費 ${money([25000,65000][S.office])}，都會納入經營報表。</p><button class="primary wide" data-action="confirmExpand">確認${S.office===0?'一樓擴編':'增建二樓'}</button>`,'expand');break;}case 'confirmExpand':{const before=modalType;const err=Game.expand(S);if(err){toast(err);break;}save();render();toast(S.office===2?'二樓已增建完成：公司擴為 1F＋2F':'一樓工作空間已擴編');forceHide();if(S.candidates.length)candidatesDialog();break;}case 'export':{const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='TZGRO-七章-'+Game.date(S)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);break;}case 'import':{const input=document.createElement('input');input.type='file';input.accept='.json';input.onchange=async()=>{try{const x=JSON.parse(await input.files[0].text());if(x.v!==Game.VERSION||!Array.isArray(x.staff)||!x.staff.length||!Number.isFinite(x.cash)||!Game.chapters[x.chapter]||!Array.isArray(x.plans)||!x.levelStart)throw Error();S=x;paused=true;forceHide();save();render();resumePhase();}catch{toast('這不是有效的七章版本存檔');}};input.click();break;}case 'restart':show('重新開始七章旅程？','<p>這會覆蓋本版本目前的進度。你可以先匯出備份；舊版遊戲存檔不受影響。</p><div class="flexbuttons" style="margin-top:20px"><button class="secondary" data-action="export">先匯出</button><button class="primary" data-action="reset">確認重新開始</button></div>','restart');break;case 'reset':S=Game.initial();forceHide();save();tab='company';render();welcome();break;}});
document.addEventListener('change',e=>{if(!detail)return;if(e.target.dataset.field){detail[e.target.dataset.field]=e.target.value;}if(e.target.matches('[data-external]'))detail.external=e.target.checked;});
window.addEventListener('message',e=>{const f=$('office');if(e.origin!==location.origin||e.source!==f?.contentWindow)return;if(e.data?.type==='tycoon-ready'){bubbles.clear();syncScene();}if(e.data?.type==='tycoon-harvest'){const b=bubbles.get(e.data.id);if(!b)return;bubbles.delete(e.data.id);const msg=Game.harvest(S,b.kind,b.person);if(msg){toast(msg);playSfx('message');save();paint();}return;}if(e.data?.type==='tycoon-person'){const p=S.staff.find(p=>p.name===e.data.name);if(p)personDialog(p.id,'status',e.data.activity||'');}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){hide();return;}if(e.key==='Tab'&&!$('overlay').hidden){const els=[...$('overlay').querySelectorAll('button:not([disabled]):not([hidden]),select,input,a[href]')].filter(x=>x.offsetParent!==null);if(!els.length)return;const first=els[0],last=els.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
setInterval(()=>{const now=performance.now(),dt=now-lastFrame;lastFrame=now;const working=S.phase==='running'&&!paused&&!modalType&&!document.hidden;bubbleTick(now,dt,working);if(S.phase!=='running'&&S.phase!=='event'&&bubbles.size)clearBubbles();if(working){const before=S.phase;Game.advanceTime(S,dt);if(S.phase!==before){save();render();resumePhase();}else if(now-lastPaint>500){lastPaint=now;paint();}if(now-lastSaved>5000){lastSaved=now;save();}}},100);
document.addEventListener('visibilitychange',()=>{lastFrame=performance.now();syncScene();});window.addEventListener('pagehide',save);
render();if(S.tutorial&&S.totalWeek===0&&S.phase==='planning')welcome();else resumePhase();
</script></body></html>
